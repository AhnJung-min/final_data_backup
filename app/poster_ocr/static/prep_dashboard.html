<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데이터 준비 현황</title>
<style>
:root{--paper:#f6f7f8;--sheet:#ffffff;--paper-2:#eceef1;--ink:#1f2328;--ink-2:#5b616a;--muted:#686e77;--rule:#d9dde2;
--grid:#e3e6ea;--axis:#b9bfc7;--accent:#1d5fb3;--accent-wash:rgba(29,95,179,.07);--track:#e6e9ed;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;
--good:#13733a;--good-wash:#e7f4ec;--warn:#8a5a00;--warn-wash:#fff4dc;--bad:#b8322b;--bad-wash:#fdeceb;
--shadow:rgba(16,24,40,.14);--check:#d5d9de;
--font:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
--mono:ui-monospace,SFMono-Regular,Consolas,"Malgun Gothic",monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#14171b;--sheet:#1b1f24;--paper-2:#23282e;--ink:#e9ecef;
--ink-2:#a9b0b9;--muted:#8f96a0;--rule:#2e343b;--grid:#262b31;--axis:#4a515a;--accent:#7fb0ee;--accent-wash:rgba(127,176,238,.09);--track:#2a3037;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;
--good:#4cc27c;--good-wash:rgba(76,194,124,.12);--warn:#e8b24a;--warn-wash:rgba(232,178,74,.12);--bad:#f07a72;--bad-wash:rgba(240,122,114,.12);
--shadow:rgba(0,0,0,.5);--check:#9aa1aa;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#14171b;--sheet:#1b1f24;--paper-2:#23282e;--ink:#e9ecef;--ink-2:#a9b0b9;--muted:#8f96a0;--rule:#2e343b;
--grid:#262b31;--axis:#4a515a;--accent:#7fb0ee;--accent-wash:rgba(127,176,238,.09);--track:#2a3037;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;
--good:#4cc27c;--good-wash:rgba(76,194,124,.12);--warn:#e8b24a;--warn-wash:rgba(232,178,74,.12);--bad:#f07a72;--bad-wash:rgba(240,122,114,.12);
--shadow:rgba(0,0,0,.5);--check:#9aa1aa;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--font);word-break:keep-all;overflow-wrap:break-word}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{width:100%;max-width:78rem;margin:0 auto;padding-left:16px;padding-right:16px}
@media (min-width:760px){.wrap{padding-left:28px;padding-right:28px}}
header.top{background:var(--sheet);border-bottom:1px solid var(--rule)}
.intro{padding-top:20px;padding-bottom:8px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;align-items:flex-end}
.eyebrow{font:500 .78rem/1.4 var(--mono);color:var(--accent);letter-spacing:.04em;margin:0}
h1{font-size:clamp(1.45rem,4vw,1.95rem);margin:.15rem 0 .2rem;letter-spacing:-.02em;line-height:1.25}
.lead{color:var(--ink-2);margin:0;max-width:46rem;font-size:.93rem}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.tabs a{padding:9px 12px 8px;border-bottom:2px solid transparent;color:var(--ink-2);text-decoration:none;white-space:nowrap;font-weight:600;font-size:.9rem}
nav.tabs a:hover{color:var(--ink)}nav.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
main{display:flex;flex-direction:column;gap:2rem;padding-top:1.4rem;padding-bottom:3rem;min-height:60vh}
main.loading{opacity:.55;transition:opacity .2s}
section{min-width:0}
h2{font-size:1.18rem;margin:0 0 .65rem;line-height:1.35;letter-spacing:-.01em}
h3{font-size:.98rem;margin:0 0 .25rem;line-height:1.4}
p{margin:0}
.sub{color:var(--ink-2);font-size:.86rem;margin:0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
code{font-family:var(--mono);font-size:.82em;background:var(--paper-2);border-radius:4px;padding:.08em .35em;overflow-wrap:anywhere;word-break:normal}
.cmd{display:block;margin-top:.3rem;padding:.4rem .6rem;white-space:pre-wrap}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:1rem 1.1rem;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9.4rem),1fr));gap:.7rem}
.tile{display:flex;flex-direction:column;gap:.1rem;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:.75rem .9rem;color:inherit;text-decoration:none;min-width:0}
a.tile:hover{border-color:var(--axis)}
.tile .k{font-size:.78rem;color:var(--muted)}.tile .v{font-size:1.45rem;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.tile .d{font-size:.78rem;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,23rem),1fr));gap:1.1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:1.1rem}
.stackv{display:flex;flex-direction:column;gap:1.1rem;min-width:0}
.scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
.scroll.tall{max-height:30rem;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.84rem;line-height:1.45}
th,td{text-align:left;vertical-align:top;padding:.45rem .65rem;border-bottom:1px solid var(--rule)}
thead th{background:var(--paper-2);font-weight:600;font-size:.78rem;color:var(--ink-2);white-space:nowrap;position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .k{display:block;font-size:.74rem;color:var(--muted)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--accent-wash)}tr.sel td{background:var(--accent-wash)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap;line-height:1.6}
.pill.good{background:var(--good-wash);color:var(--good)}.pill.warn{background:var(--warn-wash);color:var(--warn)}.pill.bad{background:var(--bad-wash);color:var(--bad)}
.pill.accent{background:var(--accent-wash);color:var(--accent)}
.diag{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:6px;border:1.5px solid var(--warn);color:var(--warn);background:var(--warn-wash)}
.note{border-left:3px solid var(--accent);background:var(--accent-wash);padding:.6rem .85rem;border-radius:0 6px 6px 0;font-size:.88rem}
.note.warn{border-left-color:var(--warn);background:var(--warn-wash)}
.notes{margin:.4rem 0 0;padding-left:1.1rem;font-size:.84rem;color:var(--ink-2);display:flex;flex-direction:column;gap:.25rem}
details{font-size:.86rem}details summary{cursor:pointer;color:var(--ink-2);font-weight:600}
.empty{display:flex;flex-direction:column;gap:.35rem;padding:1.1rem;border:1px dashed var(--axis);border-radius:10px;background:var(--sheet);font-size:.9rem}
.empty span{font-size:.8rem;color:var(--muted)}
.err{color:var(--bad)}
.controls{display:flex;flex-wrap:wrap;gap:.55rem 1rem;align-items:center}
.controls label{display:inline-flex;gap:.4rem;align-items:center;font-size:.84rem;color:var(--ink-2);min-width:0}
select,input[type=text],input[type=search]{font:inherit;font-size:.86rem;padding:.32rem .5rem;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0;max-width:100%}
input[type=checkbox]{accent-color:var(--accent)}
button{font:inherit;font-size:.84rem;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:.34rem .8rem;cursor:pointer;line-height:1.4}
button:hover{border-color:var(--axis)}button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet);font-weight:600}
button.danger{color:var(--bad);border-color:var(--bad)}
button.ghost{border-color:transparent;color:var(--accent);padding:.2rem .5rem;white-space:nowrap;flex:none}
button.ghost:hover{border-color:var(--rule)}
kbd{font:500 .7rem var(--mono);border:1px solid currentColor;border-radius:4px;padding:0 .3rem;opacity:.8;margin-left:.3rem}
/* 차트 */
.fig{margin:0;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:.9rem 1rem 1rem;min-width:0}
.fig-head{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start;margin-bottom:.55rem}
.fig-head .sub{margin-top:.1rem}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;list-style:none;margin:0 0 .55rem;padding:0;font-size:.8rem;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:.35rem}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;flex:none}.lk{display:inline-block;width:14px;height:2px;border-radius:1px;flex:none}
.sw.track{background:var(--track)}
.bars{display:grid;gap:3px}
.brow{display:grid;grid-template-columns:minmax(5rem,10.5rem) minmax(0,1fr) auto;gap:.65rem;align-items:center;padding:2px 4px;border-radius:4px}
.brow:hover,.brow:focus-visible{background:var(--accent-wash);outline:none}
.blabel{font-size:.82rem;min-width:0;overflow-wrap:anywhere}
.btrack{position:relative;height:14px;border-left:1px solid var(--axis)}
.bfill{position:absolute;inset:0 auto 0 0;border-radius:0 4px 4px 0}
.bval{font-size:.78rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.bval small{color:var(--muted);font-size:.74rem}
.stack{display:flex;gap:2px;height:14px;min-width:0}
.stack i{display:block;height:100%;min-width:2px}.stack i:last-child{border-radius:0 4px 4px 0}
.stack i.rest{background:var(--track)}
.srow{display:grid;grid-template-columns:minmax(5rem,9rem) minmax(0,1fr) auto;gap:.65rem;align-items:center;padding:3px 4px;border-radius:4px}
.srow:hover{background:var(--accent-wash)}
.dots{display:grid;gap:2px;--lw:minmax(6rem,12rem)}
.drow{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) 7rem;align-items:center;gap:.7rem;padding:3px 4px;border-radius:4px}
.drow:hover,.drow:focus-visible{background:var(--accent-wash);outline:none}
.dlabel{font-size:.82rem;min-width:0}
.dtrack{position:relative}.dtrack .g{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.dci{position:absolute;height:2px;border-radius:1px}
.ddot{position:absolute;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px var(--sheet);transform:translate(-50%,-50%)}
.dval{font-size:.76rem;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1.3;text-align:right}
.daxis{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) 7rem;gap:.7rem;padding:.2rem 4px 0}
.ticks{position:relative;height:1.2rem;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.lc{width:100%;position:relative}
.lc svg{display:block;overflow:visible}
.lc .grid{stroke:var(--grid);stroke-width:1}.lc .axis{stroke:var(--axis);stroke-width:1}
.lc .tick{fill:var(--muted);font-size:11px;font-family:var(--font)}.lc .atitle{fill:var(--ink-2);font-size:12px;font-family:var(--font)}
.lc .ref{stroke:var(--axis);stroke-width:1}.lc .reflabel{fill:var(--muted);font-size:11px;font-family:var(--font)}
.lc .cross{stroke:var(--ink-2);stroke-width:1;opacity:.6}
.heat td.cell{text-align:center;font-variant-numeric:tabular-nums;min-width:3rem}
.tip{position:fixed;z-index:50;pointer-events:none;min-width:9rem;max-width:20rem;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;box-shadow:0 6px 20px var(--shadow);padding:.45rem .65rem;font-size:.8rem;line-height:1.45}
.tip strong{display:block;font-size:.9rem;font-weight:700}.tip div{display:flex;gap:.4rem;align-items:center}
/* 개요 */
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:1rem}
.track h3{font-size:1.05rem}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin:.6rem 0}
.trio div{background:var(--paper-2);border-radius:8px;padding:.45rem .6rem}.trio dt{font-size:.74rem;color:var(--muted)}.trio dd{margin:0;font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums}
.facts{margin:.6rem 0 0;padding-left:1.05rem;font-size:.84rem;color:var(--ink-2);display:flex;flex-direction:column;gap:.2rem}
.todo{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:.55rem;font-size:.9rem}
.todo li::marker{color:var(--accent);font-weight:700}
.pbar{height:10px;background:var(--track);border-radius:5px;overflow:hidden;display:flex;gap:2px}.pbar i{display:block;height:100%;background:var(--s1)}
/* 줄 검토 */
.rv{display:grid;grid-template-columns:minmax(0,1fr) 21rem;gap:1.1rem;align-items:start}
@media (max-width:1050px){.rv{grid-template-columns:minmax(0,1fr)}}
.rc-head{display:flex;flex-wrap:wrap;gap:.35rem .5rem;align-items:center;margin-bottom:.7rem}
.crop{background:var(--paper-2);border-radius:8px;padding:10px;overflow-x:auto;text-align:center;min-height:84px;display:flex;align-items:center;justify-content:center}
.crop img{max-width:100%;height:auto;display:block;background:#fff;border-radius:2px}
.obs{background:var(--paper-2);border-radius:8px;padding:.5rem .7rem;margin-top:.7rem;font-size:.95rem}
.obs .k,.fk{display:block;font-size:.76rem;color:var(--muted);font-weight:600;margin-bottom:.15rem}
.fk{margin-top:.75rem}
.prop{width:100%;font-size:1.2rem!important;padding:.5rem .65rem!important;font-weight:500}
.prop.changed{border-color:var(--warn)!important;background:var(--warn-wash)!important}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.9rem}
.actions .spacer{flex:1}
.msg{min-height:1.4em;margin-top:.55rem;font-size:.86rem;color:var(--ink-2)}.msg.bad{color:var(--bad)}.msg.good{color:var(--good)}
.qlist{list-style:none;margin:0;padding:0;max-height:24rem;overflow:auto;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
.qlist li{border-bottom:1px solid var(--rule)}.qlist li:last-child{border-bottom:0}
.qlist button{display:grid;grid-template-columns:1.3rem minmax(0,1fr);gap:.4rem;width:100%;text-align:left;border:0;border-radius:0;padding:.32rem .55rem;font-size:.8rem;background:none}
.qlist button:hover{background:var(--accent-wash)}.qlist li.cur button{background:var(--accent-wash);font-weight:600}
.qlist .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{margin:.45rem 0}.seg .lab{display:flex;justify-content:space-between;gap:.5rem;font-size:.8rem;color:var(--ink-2);margin-bottom:.15rem}
.help{font-size:.82rem;color:var(--ink-2);margin:0;padding-left:1.05rem;display:flex;flex-direction:column;gap:.2rem}
/* 로고 */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.7rem}
.tcard{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet);display:flex;flex-direction:column;min-width:0}
.tcard .ph{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:8px;
background-color:#fff;background-image:linear-gradient(45deg,var(--check) 25%,transparent 25%),linear-gradient(-45deg,var(--check) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--check) 75%),linear-gradient(-45deg,transparent 75%,var(--check) 75%);
background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0}
.tcard .ph img{max-width:100%;max-height:100%;object-fit:contain}
.tcard .ph span{font-size:.75rem;color:#5b616a;background:#fff;padding:2px 6px;border-radius:4px}
.tcard .meta{padding:.4rem .5rem;font-size:.74rem;display:flex;flex-direction:column;gap:.2rem;min-width:0}
.tcard .meta b{font-size:.78rem;font-weight:600;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:3px}
/* 요청 의도 */
.groups{display:flex;flex-direction:column;gap:.8rem}
.grp-head{display:flex;flex-wrap:wrap;gap:.35rem .6rem;align-items:center;margin-bottom:.5rem}
.rq{border-top:1px solid var(--rule);padding:.6rem 0;display:grid;gap:.35rem}
.rq:first-of-type{border-top:0}
.rq-text{font-size:.92rem}
.rq-meta{display:flex;flex-wrap:wrap;gap:.3rem .5rem;align-items:center;font-size:.78rem;color:var(--ink-2)}
.rq-act{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.rq-act input{flex:1 1 12rem}
footer{font-size:.84rem;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:1.1rem;padding-bottom:2rem}
@media (max-width:640px){
  .brow,.srow{grid-template-columns:minmax(4.5rem,6.5rem) minmax(0,1fr) auto;gap:.45rem}
  .drow,.daxis{grid-template-columns:minmax(4.5rem,6.5rem) minmax(0,1fr) 4.8rem;gap:.45rem}
  .tile .v{font-size:1.25rem}.trio dd{font-size:1rem}
  th,td{padding:.4rem .5rem}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap intro">
    <div>
      <p class="eyebrow">posters-v2 · CI 로고 · 요청 의도 · 로컬 전용</p>
      <h1>데이터 준비 현황</h1>
      <p class="lead">빌더가 만든 결과를 한곳에서 보고, 줄 정답과 요청 의도를 사람이 확인합니다. 검토 기록 두 파일 말고는 아무것도 쓰지 않습니다.</p>
    </div>
    <div class="tools"><span id="updated">불러오는 중…</span><button type="button" id="reload">새로 읽기</button><button type="button" id="theme" aria-label="화면 밝기 바꾸기">밝기: 자동</button></div>
  </div>
  <nav class="tabs wrap" id="tabs" aria-label="화면"></nav>
</header>
<main class="wrap" id="view" aria-live="polite"></main>
<footer class="wrap">포스터 원본 ⓒ한국관광공사 TourAPI, 공공누리 제3유형 · 이 화면은 이 컴퓨터에서만 열립니다.</footer>
<div class="tip" id="tip" hidden></div>
<script>
"use strict";
const TABS = [["overview", "개요"], ["lines", "포스터 줄 정답"], ["review", "줄 검토"], ["calib", "신뢰도 보정"], ["synth", "가상 포스터 박스"], ["logos", "CI 카탈로그"], ["intent", "요청 의도 라벨"]];
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const enc = encodeURIComponent;
const fmtN = v => v == null ? "—" : Number(v).toLocaleString("ko-KR");
const pct = (v, d = 1) => v == null || isNaN(v) ? "—" : (v * 100).toFixed(d) + "%";
const fix = (v, d = 3) => v == null || isNaN(v) ? "—" : Number(v).toFixed(d);
const share = (a, b) => b ? a / b : null;
const qs = o => new URLSearchParams(Object.entries(o).filter(([, v]) => v != null && v !== "")).toString();
const tipAttr = lines => ` data-tip="${esc(JSON.stringify(lines))}" tabindex="0"`;
const store = {get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }};
const SERIES = ["--s1", "--s2", "--s3", "--s4", "--s5"];
const S = {
  tab: "overview", busy: false,
  lines: {source: null, esplit: "all"},
  review: {source: null, order: store.get("prep.order") || "shuffle", view: "todo", ocr: true, field: "", items: [], stats: null, cur: null, saving: false},
  calib: {source: null, ev: "oof", scope: "all", method: "isotonic", bins: "mass", data: null},
  synth: {metric: "recall", set: null, overlay: null},
  logos: {usable: false, terms: "all", fmt: "", q: "", entity: null, readyOnly: true, fold: true, data: null},
  intent: {view: "todo", intent: "", split: "", variant: "raw", data: null},
};

// ------------------------------------------------------------------ 공통
async function api(url) {
  const r = await fetch(url, {cache: "no-store"});
  let j = null;
  try { j = await r.json(); } catch (e) {}

const CHARTS = {};
let chartSeq = 0;
function niceTicks(lo, hi, n = 5) {
  const step0 = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), r = step0 / mag;

}

function drawLine(el, cfg) {
  const W = Math.max(240, el.clientWidth), H = cfg.height || 300, m = {l: 48, r: 12, t: 26, b: 40};
  const iw = W - m.l - m.r, ih = H - m.t - m.b, xs = cfg.x, ys = cfg.y;
  const X = v => m.l + (v - xs.min) / (xs.max - xs.min) * iw, Y = v => m.t + ih - (Math.max(ys.min, Math.min(ys.max, v)) - ys.min) / (ys.max - ys.min) * ih;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.aria || "")}">`;
  (xs.ticks || niceTicks(xs.min, xs.max)).forEach(t => { s += `<line class="grid" x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${m.t + ih}"/><text class="tick" x="${X(t)}" y="${m.t + ih + 15}" text-anchor="middle">${esc(xs.fmt(t))}</text>`; });
  (ys.ticks || niceTicks(ys.min, ys.max)).forEach(t => { s += `<line class="grid" x1="${m.l}" x2="${m.l + iw}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${m.l - 6}" y="${Y(t) + 4}" text-anchor="end">${esc(ys.fmt(t))}</text>`; });
  s += `<line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${m.t + ih}"/><line class="axis" x1="${m.l}" x2="${m.l + iw}" y1="${m.t + ih}" y2="${m.t + ih}"/>`;
  s += `<text class="atitle" x="${m.l + iw / 2}" y="${H - 4}" text-anchor="middle">${esc(xs.label)}</text><text class="atitle" x="4" y="13">↑ ${esc(ys.label)}</text>`;
  (cfg.refs || []).forEach(r => {
    if (r.diag) { const a = Math.max(xs.min, ys.min), b = Math.min(xs.max, ys.max); s += `<line class="ref" x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}"/>`; if (r.label) { const c = a + (b - a) * .62; s += `<text class="reflabel" x="${X(c) + 6}" y="${Y(c) + 14}">${esc(r.label)}</text>`; } }
    if (r.y != null && r.y <= ys.max) s += `<line class="ref" x1="${m.l}" x2="${m.l + iw}" y1="${Y(r.y)}" y2="${Y(r.y)}"/><text class="reflabel" x="${m.l + iw - 4}" y="${r.below ? Y(r.y) + 12 : Y(r.y) - 4}" text-anchor="end">${esc(r.label)}</text>`;
  });

    const pts = se.points.filter(p => p.x != null && p.y != null);
    if (!pts.length) return;
    let d = "";

    if (se.markers) pts.forEach(p => { s += `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4" fill="var(${se.color})" stroke="var(--sheet)" stroke-width="2"/>`; });
  });

  el.innerHTML = s;
  const svg = el.firstChild, cross = svg.querySelector(".cross"), hit = svg.querySelector(".hit");

    const box = svg.getBoundingClientRect(), xv = xs.min + (e.clientX - box.left - m.l) / iw * (xs.max - xs.min);

  const progTable = table(["의도(유효 라벨)", "승인", "변경", "보류", "남음", "합계"], d.intents.filter(i => st.by_intent[i]).map(i => { const x = st.by_intent[i]; return [esc(N[i] || i), fmtN(x.approved), fmtN(x.relabelled), fmtN(x.flagged), fmtN(x.pending), fmtN(x.total)]; }), [1, 2, 3, 4, 5]);
  const g2s = split ? split.group_to_split || {} : {};
  const groups = {};
  st.requests.forEach(r => { (groups[r.request_group_id] = groups[r.request_group_id] || []).push(r); });
  const shown = Object.entries(groups).filter(([g, rs]) => (!I.intent || rs.some(r => r.draft_intent === I.intent)) && (!I.split || g2s[g] === I.split) &&
    (I.view === "all" || (I.view === "todo" ? rs.some(r => r.state === "pending") : I.view === "flagged" ? rs.some(r => r.state === "flagged") : rs.some(r => r.changed_from_draft))));
  const pill = r => r.state === "approved" ? `<span class="pill good">✓ 승인</span>` : r.state === "relabelled" ? `<span class="pill accent">✎ 변경</span>` : r.state === "flagged" ? `<span class="pill warn">⚑ 보류</span>` : `<span class="pill">남음</span>`;
  const list = shown.map(([g, rs]) => `<div class="card"><div class="grp-head"><b>${esc(g)}</b>${g2s[g] ? `<span class="pill">${esc(g2s[g])}</span>` : ""}<span class="small muted">초안 의도 ${esc([...new Set(rs.map(r => N[r.draft_intent] || r.draft_intent))].join(", "))} · ${fmtN(rs.filter(r => r.state !== "pending").length)}/${fmtN(rs.length)} 검토</span></div>
    ${rs.map(r => `<div class="rq" data-rid="${esc(r.request_id)}"><div class="rq-text">${esc(r.text || "(원문 없음)")}</div>
      <div class="rq-meta">${pill(r)}<span>${esc(r.request_id)}</span><span>지금 라벨 <b>${esc(N[r.intent] || r.intent)}</b>${r.changed_from_draft ? ` (초안 ${esc(N[r.draft_intent] || r.draft_intent)})` : ""}</span>${r.suggested_intent ? `<span>제안 ${esc(N[r.suggested_intent] || r.suggested_intent)}</span>` : ""}${r.reviewer ? `<span>${esc(r.reviewer)} · ${esc((r.reviewed_at || "").replace("T", " ").slice(0, 16))}</span>` : ""}${r.note ? `<span>메모: ${esc(r.note)}</span>` : ""}</div>
      <div class="rq-act"><button type="button" class="primary" data-rq="approve">승인</button><select data-rq-intent aria-label="바꿀 의도">${d.intents.filter(i => i !== r.intent).map(i => opt(i, N[i] || i, "")).join("")}</select><button type="button" data-rq="relabel">이 의도로 변경</button>
        <input type="text" data-rq-note placeholder="메모(보류에는 꼭 적기)" maxlength="1000" autocomplete="off"><button type="button" data-rq="flag">보류</button></div></div>`).join("")}</div>`).join("");
  el.innerHTML = `<section><div class="tiles">
      <div class="tile"><span class="k">요청</span><span class="v">${fmtN(t.total)}</span><span class="d">그룹 ${fmtN(Object.keys(groups).length)}개 · 라벨 상태 DRAFT</span></div>
      <div class="tile"><span class="k">사람 확인</span><span class="v">${fmtN(t.approved + t.relabelled + t.flagged)}</span><span class="d">승인 ${fmtN(t.approved)} · 변경 ${fmtN(t.relabelled)} · 보류 ${fmtN(t.flagged)}</span></div>
      <div class="tile"><span class="k">남음</span><span class="v">${fmtN(t.pending)}</span><span class="d">기록 ${fmtN(st.entries)}줄${st.invalid_lines.length ? ` · 깨진 줄 ${st.invalid_lines.length}` : ""}</span></div></div>
      ${st.group_conflicts.length ? `<p class="note warn" style="margin-top:.7rem">한 그룹 안에서 의도가 갈린 그룹 ${st.group_conflicts.length}개: ${esc(st.group_conflicts.map(g => g.request_group_id).join(", "))}. 분할을 다시 만들어야 합니다.</p>` : ""}</section>
    <section class="grid2">${fig("의도별 검토 진행", "유효 라벨 기준. 회색은 아직 검토하지 않은 몫입니다.", progPlot, progTable, legend([...stSeries, {label: "남음", cls: "track"}]))}
      <div class="card"><h3>검토 방법</h3><ul class="help"><li><b>승인</b>: 지금 라벨이 맞습니다.</li><li><b>이 의도로 변경</b>: 고른 의도로 바꿉니다.</li><li><b>보류</b>: 판단이 어렵습니다. 이유를 메모에 꼭 적습니다.</li>
        <li>같은 그룹의 문장은 한 상황을 다섯 가지로 쓴 것입니다. 그룹 안에서 의도가 갈리면 분할을 다시 만들어야 합니다.</li><li>마지막 결정이 남습니다. 검토가 끝나면 <code>${esc(d.commands.effective)}</code></li></ul></div></section>
    <section><h2>검토 목록</h2><div class="controls" style="margin-bottom:.7rem">
      <label>보기 <select id="i-view">${opt("todo", "남은 요청이 있는 그룹", I.view)}${opt("all", "전체", I.view)}${opt("flagged", "보류가 있는 그룹", I.view)}${opt("changed", "라벨이 바뀐 그룹", I.view)}</select></label>
      <label>초안 의도 <select id="i-intent">${opt("", "전체", I.intent)}${d.intents.map(i => opt(i, N[i] || i, I.intent)).join("")}</select></label>
      <label>분할 <select id="i-split">${opt("", "전체", I.split)}${["train", "validation", "test"].map(s => opt(s, s, I.split)).join("")}</select></label>
      ${reviewerInput()}<span class="small muted">그룹 ${fmtN(shown.length)}개</span></div>
      <p class="msg ${message ? message[1] : ""}" id="i-msg" role="status">${esc(message ? message[0] : "")}</p>
      <div class="groups">${list || `<p class="muted">조건에 맞는 그룹이 없습니다.</p>`}</div></section>
    ${split ? splitBlock(split, d) : `<section><h2>분할 명세</h2>${emptyBox(d.split)}</section>`}
    ${base ? baselineBlock(base, d) : `<section><h2>기준 모델</h2>${emptyBox(d.baseline)}</section>`}`;
  $("#i-view").onchange = ev => { I.view = ev.target.value; drawIntent(); };
  $("#i-intent").onchange = ev => { I.intent = ev.target.value; drawIntent(); };
  $("#i-split").onchange = ev => { I.split = ev.target.value; drawIntent(); };
  const vs = $("#i-variant"); if (vs) vs.onchange = ev => { I.variant = ev.target.value; drawIntent(); };
  el.querySelectorAll("[data-rq]").forEach(b => b.onclick = () => recordIntent(b));
}
async function recordIntent(b) {
  const I = S.intent, row = b.closest("[data-rid]"), rid = row.dataset.rid, decision = b.dataset.rq;
  const reviewer = ($("#reviewer").value || "").trim(), note = $("[data-rq-note]", row).value.trim();
  const say = (m, c = "bad") => { const el = $("#i-msg"); el.textContent = m; el.className = "msg " + c; el.scrollIntoView({block: "nearest"}); };
  if (!reviewer) { say("검토자 이름을 먼저 적어 주세요."); $("#reviewer").focus(); return; }
  if (decision === "flag" && !note) { say("보류에는 이유를 메모에 적어 주세요."); $("[data-rq-note]", row).focus(); return; }
  const intent = decision === "relabel" ? $("[data-rq-intent]", row).value : null;
  row.querySelectorAll("button").forEach(x => x.disabled = true);
  try {
    const r = await post("/api/requests/record", {request_id: rid, decision, intent, reviewer, note});
    I.data.status = r.status;
    const y = scrollY;
    drawIntent(null, [`저장했습니다: ${rid} · ${{approve: "승인", relabel: "변경", flag: "보류"}[decision]}`, "good"]);
    scrollTo(0, y);
  } catch (err) { row.querySelectorAll("button").forEach(x => x.disabled = false); say(err.message); }
}
function splitBlock(sp, d) {
  const N = d.intent_names, near = sp.near || {}, len = sp.lengths || {}, h = (len.histogram || {});
  const counts = ["train", "validation", "test"].filter(s => (sp.splits || {})[s]);
  const splitRows = d.intents.map(i => [esc(N[i] || i), ...counts.map(s => { const x = ((sp.splits[s] || {}).by_intent || {})[i] || {}; return `${fmtN(x.groups)}그룹 · ${fmtN(x.requests)}건`; })]);
  splitRows.push(["<b>합계</b>", ...counts.map(s => `${fmtN(sp.splits[s].groups)}그룹 · ${fmtN(sp.splits[s].requests)}건`)]);
  const lenPlot = bars((h.counts || []).map((v, i) => ({label: `${h.edges[i]}–${h.edges[i + 1] ?? ""}자`, value: v, tip: [`${fmtN(v)}건`, `글자 수 ${h.edges[i]}–${h.edges[i + 1] ?? ""}`]})).filter((r, i, a) => r.value || a.slice(0, i).some(x => x.value)));
  const nh = k => { const x = (near[k] || {}).histogram || {}; return (x.counts || []).map((v, i) => ({label: `${fix(x.edges[i], 1)}–${fix(x.edges[i + 1], 1)}`, value: v, tip: [`${fmtN(v)}쌍`, `Jaccard ${fix(x.edges[i], 1)}–${fix(x.edges[i + 1], 1)}`]})); };
  const nearTable = k => table(["Jaccard", "쌍"], nh(k).map(r => [esc(r.label), fmtN(r.value)]), [1]);
  const lk = (sp.leakage || {}).by_intent || {};
  const tp = sp.templates || {};
  return `<section><h2>분할 명세 <span class="small muted">seed ${esc(sp.seed)} · ${esc(sp.unit)} 단위</span></h2>
    <div class="grid2"><div>${table(["의도", ...counts], splitRows)}<p class="small muted" style="margin-top:.4rem">결합 ${sp.join.ok ? "이상 없음" : "문제 있음"} · 원문 ${fmtN((sp.join.counts || {}).texts)} · 라벨 ${fmtN((sp.join.counts || {}).labels)} · 그룹 ${fmtN((sp.join.counts || {}).groups)} · 그룹 안 의도 하나 ${((sp.group_intent_check || {}).single_intent) ? "예" : "아니오"}</p>
      <p class="small muted">정확 중복 ${fmtN(((sp.duplicates || {}).exact || {}).sets)} · 느슨한 중복 ${fmtN(((sp.duplicates || {}).loose || {}).sets)} · 템플릿 문구를 지운 고유 핵심 문장 ${fmtN(((sp.duplicates || {}).core_text || {}).unique)}개</p></div>
      ${fig("요청 글자 수", `중앙값 ${fmtN((len.chars || {}).median)}자 · 평균 ${fmtN((len.chars || {}).mean)}자 · 최소 ${fmtN((len.chars || {}).min)} · 최대 ${fmtN((len.chars || {}).max)}`, lenPlot, table(["구간", "건"], lenPlot ? (h.counts || []).map((v, i) => [`${h.edges[i]}–${h.edges[i + 1] ?? ""}`, fmtN(v)]) : [], [1]))}</div>
    <div class="grid2" style="margin-top:1.1rem">${fig("그룹 안 문장 쌍의 비슷함", `문자 3-gram Jaccard · ${fmtN((near.within_group || {}).pairs)}쌍 · 평균 ${fix((near.within_group || {}).mean, 3)} · 기준 ${near.threshold} 이상 ${fmtN((near.within_group || {})["ge_" + near.threshold])}쌍`, bars(nh("within_group")), nearTable("within_group"))}
      ${fig("다른 그룹 문장 쌍의 비슷함", `${fmtN((near.cross_group || {}).pairs)}쌍 · 평균 ${fix((near.cross_group || {}).mean, 3)} · 최대 ${fix((near.cross_group || {}).max, 3)} · 평가 문장의 train 최대 유사도 ${fix(((near.held_out_max_vs_train || {}).max || 0) / 100, 3)}`, bars(nh("cross_group")), nearTable("cross_group"))}</div>
    <div class="grid2" style="margin-top:1.1rem"><div><h3>의도를 드러내는 낱말(누수)</h3>${table(["의도", "새는 낱말", "템플릿에서 온 것", "새는 낱말이 든 요청", "템플릿 낱말이 든 요청"], Object.entries(lk).map(([i, x]) => [esc(N[i] || i), fmtN(x.leaky_tokens), fmtN(x.template_tokens), pct(x.requests_with_leaky_token, 0), pct(x.requests_with_template_token, 0)]), [1, 2, 3, 4])}</div>
      <div><h3>템플릿 고정 문구 ${fmtN(tp.phrases)}개</h3><p class="small muted" style="margin-bottom:.4rem">한 의도 전용 ${fmtN(tp.single_intent)}개 · 세 분할 모두 등장 ${fmtN(tp.in_all_splits)}개. 그룹 단위로 나눠도 이 문구는 모든 분할에 들어갑니다.</p>
        <div class="scroll tall" style="max-height:15rem">${table(["문구", "의도", "횟수"], (tp.items || []).map(x => [esc(x.phrase), esc(N[x.intent] || x.intent), fmtN(x.count)]), [2]).replace(/^<div class="scroll">|<\/div>$/g, "")}</div></div></div>
    <ul class="notes">${(sp.notes || []).map(n => `<li>${esc(n)}</li>`).join("")}</ul></section>`;
}
function baselineBlock(b, d) {
  const I = S.intent, N = d.intent_names, sm = b.summary || {}, names = {raw: "원문", template_stripped: "템플릿 문구 지움"};
  const vkeys = Object.keys(b.variants || {});
  if (!vkeys.includes(I.variant)) I.variant = vkeys[0];
  const v = b.variants[I.variant] || {}, test = v.test || {};
  const series = vkeys.map((k, i) => ({key: k, label: names[k] || k, color: SERIES[i]}));
  const recPlot = dots(d.intents.map(i => ({label: N[i] || i, values: Object.fromEntries(vkeys.map(k => [k, {v: ((sm[k] || {}).test_recall || {})[i]}]))})), series, {ticks: [0, .25, .5, .75, 1]});
  const recTable = table(["의도", ...series.map(s => s.label)], d.intents.map(i => [esc(N[i] || i), ...vkeys.map(k => pct(((sm[k] || {}).test_recall || {})[i], 0))]), series.map((_, i) => i + 1));
  const cm = test.confusion || {};
  const bt = test.by_template || {};
  return `<section><h2>기준 모델 <span class="diag">⚠ 초안 라벨 기준</span></h2>
    <p class="note warn" style="margin:.5rem 0 .8rem">${esc(b.warning || "")}</p>
    ${table(["변형", "검증 macro-F1", "test macro-F1 (그룹 부트스트랩 95%)", "test 정확도", "문장당 추론"], vkeys.map(k => { const x = sm[k] || {}; return [esc(names[k] || k), fix(x.validation_macro_f1, 3), `${fix(x.test_macro_f1, 3)} <span class="muted">${fix((x.test_macro_f1_ci95 || [])[0], 2)}–${fix((x.test_macro_f1_ci95 || [])[1], 2)}</span>`, pct(x.test_accuracy), `${fix(x.inference_ms_per_sentence, 2)}ms`]; }), [1, 2, 3, 4])}
    <div class="grid2" style="margin-top:1.1rem">${fig("의도별 test 재현율", "test는 의도마다 2그룹 10건이라 한 그룹이 틀리면 0.5가 됩니다.", recPlot, recTable, legend(series))}
      <div class="fig"><div class="fig-head"><div><h3>혼동 행렬 · test</h3><p class="sub">행이 정답, 열이 예측입니다. 파란 칸이 맞은 수입니다.</p></div><select id="i-variant" aria-label="모델 변형">${vkeys.map(k => opt(k, names[k] || k, I.variant)).join("")}</select></div>
        ${cm.matrix ? heat(cm.labels, N, cm.matrix, "정답", "예측") : `<p class="muted">혼동 행렬이 없습니다.</p>`}
        ${bt.wrapped ? `<p class="small" style="margin-top:.5rem">템플릿 문구가 붙은 문장 정확도 ${pct(bt.wrapped.accuracy)}(${fmtN(bt.wrapped.n)}건) · 안 붙은 문장 ${pct((bt.wrapper_free || {}).accuracy)}(${fmtN((bt.wrapper_free || {}).n)}건)</p>` : ""}
        ${(test.errors || []).length ? `<details style="margin-top:.5rem"><summary>틀린 문장 ${fmtN(test.errors.length)}개</summary>${table(["요청", "정답", "예측", "확신", "문장"], test.errors.map(x => [esc(x.request_id), esc(N[x.true] || x.true), esc(N[x.pred] || x.pred), fix(x.confidence, 2), esc(x.text)]), [3])}</details>` : ""}</div></div>
    <ul class="notes">${(b.caveats || []).map(n => `<li>${esc(n)}</li>`).join("")}</ul></section>`;
}

// ------------------------------------------------------------------ 화면 전환
const RENDER = {overview: renderOverview, lines: renderLines, review: renderReview, calib: renderCalib, synth: renderSynth, logos: renderLogos, intent: renderIntent};
let renderSeq = 0;
async function route() {
  const tab = (location.hash.replace(/^#/, "") || "overview");
  S.tab = RENDER[tab] ? tab : "overview";
  document.getElementById("tabs").innerHTML = TABS.map(([k, label]) => `<a href="#${k}" class="${k === S.tab ? "on" : ""}"${k === S.tab ? ' aria-current="page"' : ""}>${label}</a>`).join("");
  const on = document.querySelector("#tabs a.on"), nav = document.getElementById("tabs");
  if (on) nav.scrollLeft = Math.max(0, on.getBoundingClientRect().left - nav.getBoundingClientRect().left + nav.scrollLeft - (nav.clientWidth - on.offsetWidth) / 2);
  const el = document.getElementById("view"), seq = ++renderSeq;
  el.classList.add("loading");
  hideTip();
  for (const k in CHARTS) delete CHARTS[k];
  try {
    await RENDER[S.tab](el, () => seq !== renderSeq);   // 늦게 끝난 이전 화면이 새 화면을 덮지 않게 한다
    if (seq !== renderSeq) return;
    drawCharts(el);
    document.getElementById("updated").textContent = "읽은 때 " + new Date().toLocaleTimeString("ko-KR", {hour12: false});
  } catch (err) {
    if (seq === renderSeq) el.innerHTML = errBox(err);
  } finally {
    if (seq === renderSeq) el.classList.remove("loading");
  }
}
window.addEventListener("hashchange", () => { scrollTo(0, 0); route(); });
document.getElementById("reload").onclick = () => route();
const THEMES = [["auto", "밝기: 자동"], ["light", "밝기: 밝게"], ["dark", "밝기: 어둡게"]];
function applyTheme(t) { if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; document.getElementById("theme").textContent = (THEMES.find(x => x[0] === t) || THEMES[0])[1]; drawCharts(); }
let theme = store.get("prep.theme") || "auto";
applyTheme(theme);
document.getElementById("theme").onclick = () => { theme = THEMES[(THEMES.findIndex(x => x[0] === theme) + 1) % THEMES.length][0]; store.set("prep.theme", theme); applyTheme(theme); };
route();
</script>
