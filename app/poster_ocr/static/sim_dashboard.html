<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0069dc">
<title>크리에이티브체커 · 가상 검수 실험</title>
<style>
:root{--blue:#0069dc;--blue-dark:#0051b2;--pale:#eaf4ff;--ink:#18283f;--navy:#152844;--muted:#64758a;--line:#dce5ee;--soft:#f4f7fa;
--green:#14765d;--green-bg:#eaf6ef;--red:#bc3f39;--red-bg:#fff0ef;--amber:#9b6505;--amber-bg:#fff7e5;--radius:16px;
--shadow:0 14px 40px rgba(27,65,105,.08);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{font:400 16px/1.6 "Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:#f6f8fb;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,p{margin:0}h1,h2,h3{letter-spacing:-.045em;line-height:1.35}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #82b9ff;outline-offset:2px}
.app-shell{display:flex;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:228px;background:#fff;border-right:1px solid var(--line);padding:32px 22px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;z-index:6}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:-.07em;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center;flex:none}
.ws{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-top:6px}
.proj-label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700}
.side-sep{border:0;border-top:1px solid var(--line);margin:2px 0}
.side-title{font-size:13px;font-weight:800;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:6px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.nav a.on{background:var(--pale);color:var(--blue)}
.steps{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.step{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted);padding:6px 4px}
.step small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--soft);color:var(--muted);flex:none}
.step.done .n{background:#e6f4ef;color:var(--green)}.step.current{color:var(--blue)}.step.current .n{background:var(--blue);color:#fff}
.side-note{margin-top:auto;font-size:12.5px;color:var(--muted);line-height:1.55;border-top:1px solid var(--line);padding-top:14px}
.main-wrap{margin-left:228px;flex:1;min-width:0}
.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 38px;position:sticky;top:0;z-index:5}
.crumb{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.crumb b{color:var(--ink)}
.conn{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#b69243;display:inline-block}.dot.on{background:#28976f}.dot.off{background:#bc3f39}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--pale);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:13px}
.app-main{max-width:1260px;padding:39px 38px 60px;margin:0 auto}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--blue)}
.page-head{margin-bottom:26px}.page-head h1{font-size:32px;margin:6px 0 6px}.page-head p{font-size:15px;color:var(--muted)}
.work-grid{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:28px;align-items:start}
.side-col{position:sticky;top:96px;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-head{padding:20px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-head h2{font-size:18px}.card-body{padding:24px 26px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.section-head h2{font-size:18px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;background:var(--pale);color:var(--blue);white-space:nowrap}
.pill.pass{background:var(--green-bg);color:var(--green)}.pill.fail{background:var(--red-bg);color:var(--red)}.pill.review{background:var(--amber-bg);color:var(--amber)}
.pill.gray{background:var(--soft);color:var(--muted)}
.run-card{display:grid;grid-template-columns:76px 1fr;gap:22px;align-items:start;padding:26px}
.spin-tile{width:76px;height:76px;border-radius:20px;background:var(--pale);display:grid;place-items:center}
.spin-tile.done{background:var(--green-bg)}.spin-tile.bad{background:var(--red-bg)}
.ring{width:38px;height:38px;border-radius:50%;border:4px solid #dceafa;border-top-color:var(--blue);animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.run-card h2{font-size:21px;margin-bottom:6px}.run-card .sub{font-size:14px;color:var(--muted)}
.progress{margin-top:18px}.progress .labels{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:6px}
.track{height:8px;border-radius:8px;background:#edf2f8;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:8px;transition:width .6s}
.stage-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.stage-list span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--soft);color:var(--muted)}
.stage-list span.active{background:var(--pale);color:var(--blue)}.stage-list span.done{background:var(--green-bg);color:var(--green)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}
.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.metric span{font-size:13px;color:var(--muted);font-weight:600;line-height:1.4}.metric strong{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.2;white-space:nowrap}
.metric.pass strong{color:var(--green)}.metric.fail strong{color:var(--red)}.metric.review strong{color:var(--amber)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--pale);border-color:#b9d6f7;color:var(--blue)}
.tabs b{font-weight:800;margin-left:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.pcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.pcard.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,105,220,.18)}
.thumb{position:relative;aspect-ratio:4/5;background:#edf2f7;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.thumb .veil{position:absolute;inset:0;background:rgba(246,248,251,.62);display:grid;place-items:center}
.thumb .veil .ring{width:30px;height:30px;border-width:3px}
.thumb .sid{position:absolute;right:6px;bottom:6px;background:rgba(21,40,68,.86);color:#fff;font-size:11.5px;font-weight:800;border-radius:5px;padding:1px 6px}
.pbody{padding:12px 13px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.pbody h3{font-size:14px;line-height:1.4}
.chips{display:flex;gap:4px}.chips i{flex:1;height:5px;border-radius:3px;background:#e7edf4}.chips i.done{background:#8fd3b6}.chips i.active{background:var(--blue);animation:pulse 1.2s ease-in-out infinite}.chips i.bad{background:#f0a8a3}
@keyframes pulse{50%{opacity:.45}}
.counts{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted)}.counts b{font-weight:800}.counts .p{color:var(--green)}.counts .f{color:var(--red)}.counts .r{color:var(--amber)}
.exp{margin-top:auto;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px;display:flex;justify-content:space-between;gap:6px}
.exp .ok{color:var(--green);font-weight:800;white-space:nowrap}.exp .bad{color:var(--red);font-weight:800;white-space:nowrap}
.summary-card{background:var(--blue);color:#fff;border-radius:var(--radius);padding:24px;box-shadow:0 10px 30px rgba(0,105,220,.13)}
.summary-card .k{font-size:13px;opacity:.9;font-weight:700}.summary-card .k2{font-size:12px;opacity:.8;margin-top:2px}
.summary-card .big{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.2;margin:4px 0 14px}
.summary-card .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.12);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:13px 24px;font-size:15px;font-weight:700;border-radius:10px;border:1px solid transparent}
.btn.white{background:#fff;color:var(--blue);border-radius:30px;width:100%;margin-top:10px}
.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-dark)}
.btn.secondary{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.small{min-height:38px;padding:8px 16px;font-size:14px}
.side-help{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;font-size:13.5px;color:var(--muted);line-height:1.65}
.side-help h3{font-size:15px;color:var(--ink);margin-bottom:6px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.log li{display:grid;grid-template-columns:44px 38px 1fr;gap:6px;color:var(--muted)}.log b{color:var(--ink)}
.result-alert{background:#fff8e8;border:1px solid #f0e2bb;border-radius:12px;padding:16px 18px;margin-bottom:18px}
.result-alert.good{background:#eef8f3;border-color:#cbe8da}
.result-alert h3{font-size:16px;margin-bottom:4px}.result-alert p{font-size:14px;color:var(--muted)}
.exp-banner{border:1px dashed #b8c6d6;border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:14px;background:#fbfcfe;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.exp-banner .tag{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.two-col{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:24px;align-items:start}
.sticky{position:sticky;top:96px}
.seg{display:flex;gap:6px}.seg button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--muted)}.seg button.on{background:var(--pale);color:var(--blue);border-color:#b9d6f7}
.imgbox{background:#edf2f7;border-radius:12px;padding:12px}
.stage{position:relative;line-height:0;box-shadow:0 7px 22px rgba(30,60,91,.13)}
.stage img{width:100%;display:block}
.ebox{position:absolute;border:2px solid #f2661f;background:rgba(255,178,49,.2);border-radius:2px}
.ebox.doc{border-color:var(--blue);background:rgba(0,105,220,.12)}
.zoom{margin-top:12px;border:2px solid var(--blue);border-radius:8px;background-repeat:no-repeat;background-color:#fff}
.zoom-label{font-size:12px;color:var(--muted);margin-top:10px;font-weight:700}
.caption{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.55}
.result-item{border:1px solid var(--line);border-radius:12px;padding:15px 16px;background:#fff;display:flex;flex-direction:column;gap:7px}
.result-item.sel{background:#f2f8ff;border-color:#b9d6f7}
.result-item .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.result-item h3{font-size:15px}.result-item .why{font-size:13px;color:var(--muted)}
.obs{background:var(--soft);border-radius:8px;padding:9px 11px;font-size:13px;min-width:0}.obs .k{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:2px}
.obs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-weight:700;font-size:13px;align-self:flex-start}
.list{display:flex;flex-direction:column;gap:10px}
.bottom-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.disclaimer{font-size:13.5px;color:var(--muted)}
.empty{font-size:14px;color:var(--muted);padding:22px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.tbl{overflow-x:auto}
td.note{min-width:160px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:700;background:var(--soft);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cm{display:grid;grid-template-columns:110px repeat(2,minmax(0,1fr));gap:6px;font-size:14px}
.cm div{padding:14px;border-radius:10px;background:var(--soft);text-align:center}
.cm .h{background:none;font-weight:700;color:var(--muted);font-size:13px;padding:8px}
.cm .good{background:var(--green-bg);color:var(--green)}.cm .bad{background:var(--red-bg);color:var(--red)}
.cm b{display:block;font-size:26px;font-weight:800}.cm small{display:block;font-size:12px;opacity:.85}
.score-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:1100px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.work-grid{grid-template-columns:minmax(0,1fr)}.side-col{position:static}.two-col{grid-template-columns:minmax(0,1fr)}.sticky{position:static}.score-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app-shell{display:block}
  .sidebar{position:sticky;top:0;width:auto;height:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:12px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .sidebar .ws,.sidebar .proj-label,.sidebar .side-sep,.sidebar .side-title,.sidebar .steps,.sidebar .side-note{display:none}
  .brand{font-size:18px}.brand .mark{width:28px;height:28px}
  .nav{flex-direction:row;gap:4px}.nav a{padding:7px 10px;font-size:13px}
  .main-wrap{margin-left:0}.topbar{position:static;padding:0 16px;height:56px}.conn .user{display:none}
  .app-main{padding:24px 16px 40px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.page-head h1{font-size:25px}
}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" aria-label="사이드바">
    <a class="brand" href="#/" aria-label="크리에이티브체커 홈"><span class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>크리에이티브체커</a>
    <p class="ws">WORKSPACE</p>
    <div class="proj-label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>내 검수 프로젝트</div>
    <hr class="side-sep">
    <p class="side-title">가상 포스터 검수 실험</p>
    <nav class="nav" aria-label="화면">
      <a href="#/" data-nav="overview">검수 현황</a>
      <a href="#/score" data-nav="score">실험 채점</a>
    </nav>
    <div class="steps" id="side-steps"></div>
    <p class="side-note">자동 판정은 담당자의 최종 승인이 아닙니다.<br>자료는 이 PC의 검수 작업자(PaddleOCR)에서만 처리됩니다.</p>
  </aside>
  <div class="main-wrap">
    <header class="topbar">
      <div class="crumb">내 검수 프로젝트 / <b id="crumb">가상 포스터 검수 실험</b></div>
      <div class="conn"><i class="dot" id="conn-dot"></i><span id="conn-text">연결 확인 중</span><span class="user">실험 담당자</span><span class="avatar">실</span></div>
    </header>
    <main class="app-main" id="view" aria-live="polite"></main>
  </div>
</div>
<script>
const STATUS = {pass: "충족", fail: "위반", review: "확인 필요"};
// 세트 단위 요약은 실험용이다(팀 서비스는 항목별 충족·위반·확인 필요만 보여 준다)
const VERDICT = {pass: ["정보 항목 충족", "pass"], fail: ["위반 있음", "fail"], review: ["정보 항목 확인 필요", "review"]};
const STAGES = ["접수", "기준 문서 읽기", "기준 추출", "포스터 읽기", "항목 검수", "결과 저장"];
const STAGE_PILL = {queued: ["접수됨", "gray"], doc_ocr: ["기준 문서 읽는 중", ""], criteria: ["기준 추출 · 포스터 대기", "gray"],
                    poster_ocr: ["포스터 읽는 중", ""], failed: ["검수를 완료하지 못했어요", "fail"], stale: ["원본이 바뀌어 다시 읽어야 해요", "review"]};
const TYPE_SHORT = {date_shift: "행사 기간 하루 밀림(요일 재계산)", date_shift_stale_weekday: "행사 기간 하루 밀림(요일 그대로)"};
const LBL = {title: "행사명", edition: "회차", schedule: "행사 기간", time: "운영 시간", venue: "행사 장소", host: "주최", organizer: "주관", contact: "문의처", slogan: "필수 문구", logo: "기관 로고"};
let S = null, conn = "pending", lastSig = "", filter = "all", detailCache = {}, detailError = {}, detailTab = "poster", selected = null, resultFilter = "all";
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = v => v == null ? "—" : (v * 100).toFixed(1).replace(/\.0$/, "") + "%";
const mins = s => s < 60 ? `${Math.max(1, Math.round(s))}초` : `${Math.round(s / 60)}분`;
const hhmm = t => new Date(t * 1000).toTimeString().slice(0, 5);
const route = () => (location.hash.replace(/^#\/?/, "") || "").split("/");
const file = (path, sha) => `/files/${encodeURI(path)}?v=${encodeURIComponent(sha || "")}`;
const shortType = m => m ? (TYPE_SHORT[m.type] || m.description) : "";

function chips(stage) {
  const active = {doc_ocr: 1, poster_ocr: 3}[stage];
  const done = {queued: 1, doc_ocr: 1, criteria: 3, poster_ocr: 3, done: 6, failed: 0, stale: 0}[stage];
  return STAGES.map((t, i) => `<i class="${stage === "failed" || stage === "stale" ? "bad" : i === active ? "active" : i < done ? "done" : ""}" title="${esc(t)}"></i>`).join("");
}

function expMark(it) {
  if (it.stage !== "done") return `<span>실험 정답 · ${it.truth === "match" ? "일치 세트" : "불일치 세트"}</span>`;
  const truth = it.truth === "mismatch", pred = it.predicted_mismatch;
  const mark = truth && pred ? `<span class="ok">✓ 불일치 탐지${it.field_hit ? "" : " (다른 항목)"}</span>` : truth ? `<span class="bad">✕ 놓침</span>`
    : pred ? `<span class="bad">✕ 오탐</span>` : `<span class="ok">✓ 일치 통과</span>`;
  return `<span>실험 · ${truth ? esc(shortType(it.mismatch)) : "일치 세트"}</span>${mark}`;
}

function sideSteps() {
  const st = !S ? 0 : S.finished ? 4 : S.started ? 3 : 2;
  const items = [["자료 입력", "가상 세트 40건"], ["기준 확인", "문서 OCR로 추출 · 실험이라 사람 확인 생략"], ["검수 실행", "PaddleOCR · 항목 대조"], ["결과 확인", "항목별 근거"]];
  document.getElementById("side-steps").innerHTML = items.map(([t, d], i) => {
    const cls = i + 1 < st ? "done" : i + 1 === st ? "current" : "";
    return `<div class="step ${cls}"><span class="n">${i + 1 < st ? "✓" : i + 1}</span><span>${t}<small>${d}</small></span></div>`;
  }).join("");
}

function topbar() {
  const dot = document.getElementById("conn-dot"), text = document.getElementById("conn-text");
  const [cls, label] = conn === "offline" ? ["off", "서버 연결 필요"] : conn === "error" ? ["off", "서버 오류 · 다시 시도 중"] : !S ? ["", "연결 확인 중"]
    : S.stalled ? ["off", "검수 작업자 응답 없음"] : S.running ? ["on", "검수 작업자 실행 중"] : S.finished ? ["on", "검수 서버 연결됨"] : ["", "서버 연결 · 작업 대기"];
  dot.className = "dot " + cls;
  text.textContent = label;
  const page = route()[0] || "overview";
  document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("on", page === a.dataset.nav || (page === "set" && a.dataset.nav === "overview")));
}

function verdictCounts() {
  const c = {pass: 0, fail: 0, review: 0};
  S.items.forEach(it => { if (it.verdict) c[it.verdict]++; });
  return c;
}

const CHECK_ICON = `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#14765d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const WARN_ICON = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#bc3f39" stroke-width="2" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>`;

function runCard() {
  const p = S.cases_total ? S.cases_done / S.cases_total : 0;
  const cur = S.current && S.items.find(it => S.current.startsWith(it.id + "-"));
  let title, sub, tile = `<div class="spin-tile"><div class="ring"></div></div>`, eyebrow = "대기";
  if (S.finished_with_problems) { eyebrow = "검수 종료 · 문제 있음"; title = `자료 ${S.failed.length + S.stale.length}장을 처리하지 못했어요 · 세트 ${S.sets_done}/${S.sets_total}건 완료`;
    sub = `${S.failed.length ? `읽기 실패 ${S.failed.map(esc).join(", ")}. ` : ""}${S.stale.length ? `원본이 바뀐 결과 ${S.stale.map(esc).join(", ")}. ` : ""}해당 결과 파일을 지우고 <code>--only</code>로 다시 실행하세요.`;
    tile = `<div class="spin-tile bad">${WARN_ICON}</div>`; }
  else if (S.finished) { eyebrow = "검수 완료"; title = `가상 포스터 ${S.sets_total}건 검수를 완료했어요.`; sub = `세트를 눌러 항목별 결과와 근거를 확인하세요. <a href="#/score" style="color:var(--blue);font-weight:700">실험 채점 보기 →</a>`; tile = `<div class="spin-tile done">${CHECK_ICON}</div>`; }
  else if (S.stalled) { eyebrow = "작업자 응답 없음"; title = "검수 작업자가 응답하지 않아요."; sub = "마지막 결과 이후 10분 넘게 새 결과가 없어요. 작업자 로그(.runtime/poster-ocr/sim-run.log)를 확인하세요."; tile = `<div class="spin-tile bad">${WARN_ICON}</div>`; }
  else if (S.running && cur) {
    eyebrow = "검수 실행 중";
    title = `${esc(cur.id)} · ${esc(cur.title)}`;
    sub = S.current.endsWith("-doc") ? "기준 문서(디자인 용역 표준계약서)에서 문구와 위치를 읽고 있어요." : "포스터에서 문구와 위치를 읽고 있어요. 다 읽으면 기준과 바로 비교해요.";
  } else { title = "검수 순서를 기다리고 있어요."; sub = "검수 작업자(PaddleOCR)를 시작하면 세트 순서대로 기준 문서 → 포스터를 읽어요."; }
  const curStage = cur ? cur.stage : null;
  const st = [["이미지와 기준 확인", curStage ? "done" : ""], ["문구와 위치 읽기", curStage ? "active" : ""], ["기준과 추출 문구 비교", ""], ["항목별 결과 정리", ""]];
  const e = S.engine || {};
  const eng = e.paddleocr_version ? `PaddleOCR ${esc(e.paddleocr_version)} · ${esc(e.detection)} + ${esc(e.recognition)}` : "PaddleOCR";
  const avg = S.avg_seconds || {};
  return `<div class="card run-card">${tile}<div>
    <p class="eyebrow" style="font-size:12px;margin-bottom:4px">${eyebrow}</p>
    <h2>${title}</h2><p class="sub">${sub}</p>
    <div class="progress"><div class="labels"><span>실제 검수 진행 상태 · 자료 ${S.cases_done}/${S.cases_total}장 · 세트 ${S.sets_done}/${S.sets_total}건${S.failed.length ? ` · 실패 ${S.failed.length}장` : ""}</span><span>${Math.round(p * 100)}%</span></div>
    <div class="track"><div class="fill" style="width:${(p * 100).toFixed(1)}%"></div></div></div>
    ${S.running ? `<div class="stage-list">${st.map(([t, c]) => `<span class="${c}">${c === "done" ? "✓ " : ""}${t}</span>`).join("")}</div>` : ""}
    <p class="sub" style="margin-top:12px;font-size:13px">${S.running ? `남은 시간 약 ${mins(S.eta_seconds)} · ` : ""}${eng} · CPU · 문서 평균 ${avg.document ? avg.document.toFixed(1) + "초" : "—"} · 포스터 평균 ${avg.poster ? avg.poster.toFixed(1) + "초" : "—"}${S.load_seconds ? ` · 모델 준비 ${S.load_seconds.toFixed(1)}초` : ""}</p>
  </div></div>`;
}

function overview() {
  const c = verdictCounts();
  const wrong = it => it.stage === "done" && (it.truth === "mismatch") !== it.predicted_mismatch;
  const bad = it => it.stage === "failed" || it.stage === "stale";
  const counts = {all: S.items.length, progress: S.items.filter(i => i.stage !== "done" && !bad(i)).length, problem: S.items.filter(bad).length, fail: c.fail, review: c.review, pass: c.pass, wrong: S.items.filter(wrong).length};
  const tabs = [["all", "전체"], ["progress", "진행 중·대기"], ...(counts.problem ? [["problem", "처리 실패"]] : []), ["fail", "위반 있음"], ["review", "정보 항목 확인 필요"], ["pass", "정보 항목 충족(시각 확인 남음)"], ["wrong", "실험 오답"]];
  const shown = S.items.filter(it => filter === "all" || (filter === "progress" ? it.stage !== "done" && !bad(it) : filter === "problem" ? bad(it) : filter === "wrong" ? wrong(it) : it.verdict === filter));
  const r = S.report, cm = r.confusion;
  const cur = S.history.find(h => h.current) || {rules: S.rules};
  const heading = S.finished ? ["STEP 04 · 결과 확인", `가상 포스터 ${S.sets_total}건의 검수 결과를 확인하세요.`]
    : S.finished_with_problems ? ["STEP 04 · 결과 확인", "처리하지 못한 자료가 있어요. 나머지 결과를 확인하세요."]
    : S.stalled ? ["STEP 03 · 검수 실행", "검수가 멈췄어요. 작업자 상태를 확인하세요."] : ["STEP 03 · 검수 실행", "기준 문서와 포스터를 대조하고 있어요."];
  return `<div class="page-head"><p class="eyebrow">${heading[0]}</p><h1>${heading[1]}</h1>
    <p>디자인 용역 표준계약서(전문·첨부) ${S.sets_total}건과 납품 포스터 ${S.sets_total}장을 PaddleOCR로 읽고, 문서에서 추출한 표기 기준을 포스터와 항목별로 비교합니다.</p></div>
  <div class="work-grid"><div>
    ${runCard()}
    <div class="metrics">
      <div class="metric"><span>검수 완료</span><strong>${S.sets_done}<small style="font-size:15px;color:var(--muted)"> / ${S.sets_total}</small></strong></div>
      <div class="metric fail"><span>위반 있는 세트</span><strong>${c.fail}</strong></div>
      <div class="metric review"><span>정보 항목에 확인<br>필요가 있는 세트</span><strong>${c.review}</strong></div>
      <div class="metric pass"><span>정보 항목 충족<br>(시각 확인 남음)</span><strong>${c.pass}</strong></div>
    </div>
    <div class="section-head"><h2>실험용 일괄 보기</h2><span class="pill gray">서비스에는 없는 화면 · 세트 ${S.sets_total}건을 한눈에</span></div>
    <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button class="${filter === k ? "on" : ""}" data-filter="${k}">${t}<b>${counts[k]}</b></button>`).join("")}</div>
    ${shown.length ? `<div class="grid">${shown.map(card).join("")}</div>` : `<p class="empty">이 상태에 해당하는 항목이 없습니다.</p>`}
  </div>
  <div class="side-col">
    <div class="summary-card"><p class="k">실험 채점 · 정답 대비</p><p class="k2">${esc(cur.rules)} · 같은 40세트를 보고 고친 규칙(낙관적)</p><p class="big">${r.n ? pct(r.accuracy) : "—"}</p>
      <div class="row"><span>불일치 세트 탐지</span><b>${cm.tp} / ${cm.tp + cm.fn}</b></div>
      <div class="row"><span>일치 세트 오탐</span><b>${cm.fp} / ${cm.fp + cm.tn}</b></div>
      <div class="row"><span>오류 항목까지 맞힘</span><b>${r.rows.filter(x => x.field_hit).length} / ${cm.tp + cm.fn}</b></div>
      <div class="row"><span>일치 세트 중 정보 항목 확인 필요</span><b>${S.match_review} / ${cm.fp + cm.tn}</b></div>
      <a class="btn white" href="#/score">채점 상세 보기 →</a></div>
    <div class="side-help"><h3>이 실험은</h3>가상 축제 ${S.sets_total}건에 대해 기준 문서와 포스터를 한 쌍씩 만들었습니다. ${esc(S.meta.match)}쌍은 내용이 같고, ${esc(S.meta.mismatch)}쌍은 포스터 한 칸이 문서와 다릅니다(날짜·회차·장소·행사명·주관·문의처·시간). 별도 문서 추출 기능 없이 문서도 PaddleOCR로 읽습니다. 서비스에서는 추출한 기준을 담당자가 확정하지만, 이 실험에서는 그 단계를 생략했습니다.</div>
    <div class="side-help"><h3>최근 처리</h3>${S.log.length ? `<ul class="log">${S.log.slice(0, 9).map(l => `<li><span>${hhmm(l.t)}</span><b>${esc(l.set)}</b><span>${esc(l.text)}</span></li>`).join("")}</ul>` : "아직 처리한 자료가 없습니다."}</div>
  </div></div>`;
}

function card(it) {
  const pill = it.stage === "done" ? VERDICT[it.verdict] : STAGE_PILL[it.stage];
  const busy = it.stage === "doc_ocr" || it.stage === "poster_ocr";
  const counts = it.counts ? `<div class="counts"><span class="p">충족 <b>${it.counts.pass}</b></span><span class="f">위반 <b>${it.counts.fail}</b></span><span class="r">확인 필요 <b>${it.counts.review}</b></span></div>`
    : `<div class="counts"><span>${esc(STAGE_PILL[it.stage][0])}</span></div>`;
  return `<a class="pcard ${busy ? "active" : ""}" href="#/set/${encodeURIComponent(it.id)}">
    <div class="thumb"><img loading="lazy" src="${file(it.poster, it.poster_sha)}" alt="${esc(it.title)} 포스터"><span class="sid">${esc(it.id)}</span>${it.stage === "queued" || busy ? `<div class="veil">${busy ? `<div class="ring"></div>` : ""}</div>` : ""}</div>
    <div class="pbody"><span class="pill ${pill[1]}">${pill[0]}</span><h3>${esc(it.title)}</h3><div class="chips">${chips(it.stage)}</div>${counts}<div class="exp">${expMark(it)}</div></div></a>`;
}

function boxes(list, size, cls) {
  if (!size) return "";
  const [W, H] = size;
  return list.filter(Boolean).map(b => `<div class="ebox ${cls}" style="left:${b[0] / W * 100}%;top:${b[1] / H * 100}%;width:${(b[2] - b[0]) / W * 100}%;height:${(b[3] - b[1]) / H * 100}%"></div>`).join("");
}

function zoomCrop(src, size, box) {
  // 기준 문서는 축소하면 글자를 읽기 어려워, 선택한 칸 주변을 크게 잘라 보여 준다
  const [W, H] = size, pad = 18;
  const x0 = Math.max(0, box[0] - pad), x1 = Math.min(W, box[2] + pad + 220), y0 = Math.max(0, box[1] - pad), y1 = Math.min(H, box[3] + pad);
  const cw = x1 - x0, ch = y1 - y0;
  return `<p class="zoom-label">선택한 칸 확대(실험용)</p><div class="zoom" role="img" aria-label="기준 문서 확대" style="aspect-ratio:${cw}/${ch};background-image:url('${src}');background-size:${W / cw * 100}% auto;background-position:${W === cw ? 0 : x0 / (W - cw) * 100}% ${H === ch ? 0 : y0 / (H - ch) * 100}%"></div>`;
}

function detailView(id) {
  const d = detailCache[id], it = S && S.items.find(x => x.id === id);
  if (detailError[id] === 404 || (S && !it)) return `<p class="empty">${esc(id)} 세트를 찾을 수 없어요. <a href="#/" style="color:var(--blue);font-weight:700">검수 현황으로</a></p>`;
  if (detailError[id]) return `<p class="empty">세트 자료를 불러오지 못했어요(HTTP ${esc(detailError[id])}). 다시 시도하고 있어요.</p>`;
  if (!d || !it) return `<p class="empty">서버에 저장된 자료를 불러오고 있어요.</p>`;
  const s = d.set, c = d.check, m = s.mismatch;
  const printed = m ? (m.field === "schedule" ? s.poster.schedule : m.poster) : null;

    ${c ? (s.label === "mismatch" ? (c.predicted_mismatch ? `<span class="pill pass">✓ 위반으로 잡음${it.field_hit ? " · 해당 항목" : " · 다른 항목"}</span>` : `<span class="pill fail">✕ 놓침</span>`) :
      (c.predicted_mismatch ? `<span class="pill fail">✕ 오탐</span>` : `<span class="pill pass">✓ 일치로 통과</span>`)) : ""}</div>`;
  const imgCol = imagePanel(d);
  if (!c) {

                 poster_ocr: "포스터에서 문구와 위치를 읽고 있어요.", failed: "검수를 완료하지 못했어요.", stale: "원본이 바뀌어 다시 읽어야 해요."}[it.stage] || "";
    const err = [d.document_ocr, d.poster_ocr].filter(x => x && x.error).map(x => x.error).join(" / ");
    return `<p class="eyebrow">STEP 03 · 검수 실행</p><div class="page-head"><h1>${esc(s.document.official)}</h1><p>${esc(s.id)} · ${esc((STAGE_PILL[it.stage] || [""])[0])}</p></div>${truth}
      <div class="two-col"><div class="sticky">${imgCol}</div><div class="card"><div class="card-body"><div class="run-card" style="padding:0;grid-template-columns:60px 1fr">${it.stage === "failed" || it.stage === "stale" ? `<div class="spin-tile bad" style="width:60px;height:60px">${WARN_ICON}</div>` : `<div class="spin-tile" style="width:60px;height:60px"><div class="ring"></div></div>`}<div>
      <h2>${msg}</h2><p class="sub">${it.stage === "failed" || it.stage === "stale" ? `${err ? `오류: ${esc(err)}. ` : ""}data/runtime/poster-ocr/sim/runs/paddleocr/에서 이 세트의 결과 파일을 확인한 뒤 <code>ocr_worker.py --only ${esc(s.id)}-doc ${esc(s.id)}-poster</code>로 다시 실행하세요(실패했거나 원본이 바뀐 결과는 다시 읽습니다).` : "문서와 포스터를 모두 읽으면 항목별 결과가 여기에 나타나요."}</p></div></div></div></div></div>`;
  }
  const list = c.results.filter(r => resultFilter === "all" || r.status === resultFilter);

    ${truth}
    <div class="result-alert ${needs ? "" : "good"}"><h3>${needs ? "담당자 확인이 필요한 항목을 살펴보세요." : "선택한 정보 기준의 근거를 확인했습니다."}</h3>
    <p>OCR에서 읽은 문구를 기준과 비교한 결과입니다. ‘확인 필요’ 항목과 최종 승인 여부는 담당자가 검토해 주세요.</p></div>
    <div class="metrics" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:0"><div class="metric pass"><span>충족</span><strong>${n.pass}</strong></div><div class="metric fail"><span>위반</span><strong>${n.fail}</strong></div><div class="metric review"><span>확인 필요</span><strong>${n.review}</strong></div></div>
    <div class="two-col"><div class="sticky">${imgCol}</div><div>
      <div class="tabs">${[["all", "전체", total], ["fail", "위반", n.fail], ["review", "확인 필요", n.review], ["pass", "충족", n.pass]].map(([k, t, v]) => `<button class="${resultFilter === k ? "on" : ""}" data-rfilter="${k}">${t}<b>${v}</b></button>`).join("")}</div>
      <div class="list">${list.length ? list.map(resultItem).join("") : `<p class="empty">이 상태에 해당하는 항목이 없습니다.</p>`}</div>
    </div></div>
    <div class="bottom-row"><p class="disclaimer">검수 실행 완료는 최종 승인을 의미하지 않습니다.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn secondary small" href="/api/set/${encodeURIComponent(s.id)}" target="_blank" rel="noopener">결과 JSON 보기</a><a class="btn primary small" href="#/">검수 현황으로</a></div></div>`;
}

function imagePanel(d) {
  const c = d.check, sel = c && selected ? c.results.find(r => r.key === selected) : null;
  const tab = detailTab;
  const src = tab === "poster" ? file(d.set.files.poster, d.sha.poster) : file(d.set.files.document, d.sha.document);
  const size = tab === "poster" ? (d.poster_ocr || {}).size || [886, 1254] : (d.document_ocr || {}).size || [1240, 1754];
  const marks = sel ? (tab === "poster" ? boxes(sel.evidence.map(e => e.bbox), size, "") : boxes([sel.source_box], size, "doc")) : "";
  const zoom = sel && tab === "doc" && sel.source_box ? zoomCrop(src, size, sel.source_box) : "";
  const cap = sel ? `<b>선택한 근거</b> · ${esc(sel.label)} — ${tab === "poster" ? (sel.evidence.length ? esc(sel.evidence.map(e => `${e.text} (신뢰도 ${(e.confidence * 100).toFixed(1)}%)`).join(" / ")) : "포스터에서 찾은 위치가 없습니다.") : esc(sel.expected || "문서에서 읽지 못함")}
     <button class="linkbtn" data-clear="1" style="margin-left:6px">표시 해제</button>` : "항목의 ‘위치 보기’를 누르면 이미지에서 해당 영역을 확인할 수 있어요.";
  return `<div class="card"><div class="card-head"><h2>검수 대상 이미지</h2><span class="pill gray">실험용 · 기준 문서 보기는 서비스에 없음</span><div class="seg"><button class="${tab === "poster" ? "on" : ""}" data-tab="poster">납품 포스터</button><button class="${tab === "doc" ? "on" : ""}" data-tab="doc">기준 문서</button></div></div>
    <div class="card-body"><div class="imgbox"><div class="stage"><img src="${src}" alt="${tab === "poster" ? "납품 포스터" : "기준 문서"}">${marks}</div></div>${zoom}<p class="caption">${cap}</p></div></div>`;
}

function resultItem(r) {
  const np = r.evidence.length, nd = r.source_box ? 1 : 0;
  const where = [np ? `포스터 ${np}곳` : "", nd ? "문서 1곳" : ""].filter(Boolean).join(" · ");
  return `<div class="result-item ${selected === r.key ? "sel" : ""}"><div class="top"><span class="pill ${r.status}">${r.status === "pass" ? "✓" : "!"} ${STATUS[r.status]}</span><span style="font-size:12.5px;color:var(--muted);font-weight:700">${r.kind === "visual" ? "시각 검수" : "정보 검수"}</span></div>
    <h3>${esc(r.label)}${r.expected ? `: ${esc(r.expected)}` : ""}</h3><p class="why">${esc(r.reason)}${r.method ? ` · ${esc(r.method)}` : ""}</p>
    <div class="obs-grid"><div class="obs"><span class="k">기준 문서에서 읽은 문구</span>${esc(r.expected || "—")}</div><div class="obs"><span class="k">이미지에서 읽은 문구</span>${esc(r.observed || "—")}</div></div>
    ${where ? `<button class="linkbtn" data-sel="${esc(r.key)}">위치 보기 · ${where}</button>` : ""}</div>`;
}

function scoreView() {
  const r = S.report, cm = r.confusion;
  const cur = S.history.find(h => h.current) || {rules: S.rules};
  const types = Object.entries(r.by_type).sort((a, b) => a[1].label.localeCompare(b[1].label, "ko"));
  return `<div class="page-head"><p class="eyebrow">실험 채점</p><h1>정답과 비교한 검수 성능</h1><p>완료한 ${r.n}세트 기준. 세트에 ‘위반’ 항목이 하나라도 있으면 불일치로 판정한 것으로 셉니다. ‘확인 필요’는 불일치로 세지 않습니다. 현재 규칙(${esc(cur.rules)})은 이 40세트를 보고 고쳤으므로 점수가 낙관적입니다.</p></div>
  <div class="score-grid">
    <div class="card"><div class="card-head"><h2>세트 판정 혼동행렬</h2><span class="pill">정확도 ${pct(r.accuracy)} · ${esc(cur.rules)} · 같은 40세트로 조정(낙관적)</span></div><div class="card-body">
      <div class="cm"><div class="h"></div><div class="h">판정: 불일치</div><div class="h">판정: 일치·확인 필요</div>
        <div class="h">정답 불일치</div><div class="good"><b>${cm.tp}</b>탐지</div><div class="bad"><b>${cm.fn}</b>놓침</div>
        <div class="h">정답 일치</div><div class="bad"><b>${cm.fp}</b>오탐</div><div class="good"><b>${cm.tn}</b>통과<small>정보 항목 충족 ${cm.tn - S.match_review}(시각 확인 남음) · 정보 항목 확인 필요 ${S.match_review}</small></div></div>
      <p class="caption">재현율(불일치 탐지) ${pct(r.recall)} · 정밀도 ${pct(r.precision)}. 규칙을 이 40세트로 고쳤으므로 새 세트로 다시 재야 합니다.</p></div></div>
    <div class="card"><div class="card-head"><h2>오류 유형별 탐지</h2></div><div class="tbl">
      <table><thead><tr><th>오류 유형</th><th class="num">세트</th><th class="num">위반으로 잡음</th><th class="num">해당 항목까지</th></tr></thead><tbody>
      ${types.length ? types.map(([k, t]) => `<tr><td>${esc(TYPE_SHORT[k] || t.label)}</td><td class="num">${t.n}</td><td class="num">${t.caught}</td><td class="num">${t.caught_field}</td></tr>`).join("") : `<tr><td colspan="4">아직 완료한 불일치 세트가 없습니다.</td></tr>`}</tbody></table></div></div>
    <div class="card"><div class="card-head"><h2>기준 문서 판독 정확도</h2><span class="pill gray">문서 OCR → 기준 값</span></div><div class="tbl">
      <table><thead><tr><th>항목</th><th class="num">세트</th><th class="num">정답과 같음</th><th class="num">비율</th></tr></thead><tbody>
      ${Object.entries(r.document_read).map(([k, v]) => `<tr><td>${esc(LBL[k] || k)}</td><td class="num">${v.n}</td><td class="num">${v.ok}</td><td class="num">${pct(v.ok / v.n)}</td></tr>`).join("") || `<tr><td colspan="4">아직 없습니다.</td></tr>`}</tbody></table></div></div>
    <div class="card"><div class="card-head"><h2>잘못 낸 ‘위반’</h2><span class="pill gray">오탐 항목</span></div><div class="tbl">
      <table><thead><tr><th>항목</th><th class="num">건수</th></tr></thead><tbody>
      ${Object.entries(r.field_false_alarms).map(([k, v]) => `<tr><td>${esc(LBL[k] || k)}</td><td class="num">${v}</td></tr>`).join("") || `<tr><td colspan="2">잘못 낸 위반이 없습니다.</td></tr>`}</tbody></table>
      <p class="caption" style="padding:0 16px 14px">일치 세트에서 낸 위반과, 불일치 세트에서 정답 항목이 아닌 곳에 낸 위반입니다.</p></div></div>
  </div>
  <div class="card" style="margin-top:20px"><div class="card-head"><h2>대조 규칙 개선 기록</h2><span class="pill gray">r1·r2는 같은 OCR · r3부터 포스터 3장 다시 읽음</span></div><div class="tbl">
    <table><thead><tr><th>규칙</th><th>설명</th><th class="num">정확도</th><th class="num">불일치 탐지</th><th class="num">오탐</th><th class="num">오류 항목까지 맞힘</th><th class="num">정답 아닌 항목에 낸 위반</th></tr></thead><tbody>
    ${S.history.map(h => `<tr><td><b>${esc(h.rules)}</b>${h.current ? " · 현재" : ""}</td><td class="note">${esc(h.note)}</td><td class="num">${pct(h.accuracy)}</td><td class="num">${h.confusion.tp} / ${h.confusion.tp + h.confusion.fn}</td><td class="num">${h.confusion.fp} / ${h.confusion.fp + h.confusion.tn}</td><td class="num">${h.field_hit}</td><td class="num">${h.wrong_field}</td></tr>`).join("")}
    </tbody></table><p class="caption" style="padding:0 16px 14px">r2: 낱말이 통째로 안 읽히면 ‘확인 필요’, 라벨(주최·주관·장소) 옆 문구 우선 비교, 기준 문서 안에서 행사명이 서로 다르게 읽히면 ‘확인 필요’. r3: 검증에서 찾은 구현 버그 수정(글자 크기가 다른 박스를 한 줄로 묶던 문제, 장식 문장부호가 판독 신뢰도를 끌어내리던 문제)과 낡은 입력으로 읽힌 포스터 3장 다시 읽기. r4: 글자 없는 줄 제외, 라벨 경로도 못 읽은 낱말은 ‘확인 필요’, 기간·회차 위반에 판독 신뢰도 기준, 겹친 OCR 박스의 중복 글자 제거. 모두 이 40세트를 보고 고쳤으므로, 새 가상 세트로 다시 재야 합니다.</p></div></div>
  <div class="card" style="margin-top:20px"><div class="card-head"><h2>세트별 결과</h2></div><div class="tbl">
    <table><thead><tr><th>세트</th><th>정답</th><th>오류 유형</th><th>세트 요약(실험용)</th><th>위반 항목</th><th>채점</th></tr></thead><tbody>
    ${r.rows.map(x => { const item = S.items.find(i => i.id === x.set); return `<tr><td><a href="#/set/${encodeURIComponent(x.set)}" style="color:var(--blue);font-weight:700">${esc(x.set)}</a></td><td>${x.truth === "match" ? "일치" : "불일치"}</td><td>${x.type ? esc(shortType(item.mismatch)) : "—"}</td>
      <td><span class="pill ${VERDICT[x.verdict][1]}">${VERDICT[x.verdict][0]}</span></td><td>${esc(x.fails.map(f => LBL[f] || f).join(", ")) || "—"}</td>
      <td>${(x.truth === "mismatch") === (x.predicted === "mismatch") ? `<span class="pill pass">맞음</span>` : `<span class="pill fail">${x.truth === "mismatch" ? "놓침" : "오탐"}</span>`}</td></tr>`; }).join("") || `<tr><td colspan="6">아직 완료한 세트가 없습니다.</td></tr>`}
    </tbody></table></div></div>
  <div style="margin-top:20px"><a class="btn secondary small" href="#/">검수 현황으로</a></div>`;
}

function render() {
  const view = document.getElementById("view"), [page, id] = route();
  sideSteps(); topbar();
  if (!S) { view.innerHTML = `<p class="empty">${conn === "offline" ? "검수 서버에 연결할 수 없어요. 대시보드 서버가 켜져 있는지 확인하세요." : conn === "error" ? "서버 오류로 자료를 불러오지 못했어요. 다시 시도하고 있어요." : "서버에 저장된 자료를 불러오고 있어요."}</p>`; return; }
  document.getElementById("crumb").textContent = page === "set" ? `가상 포스터 검수 실험 / ${id}` : page === "score" ? "가상 포스터 검수 실험 / 실험 채점" : "가상 포스터 검수 실험";
  view.innerHTML = page === "set" ? detailView(id) : page === "score" ? scoreView() : overview();
}

async function loadDetail(id, force) {
  const it = S && S.items.find(x => x.id === id), cached = detailCache[id];
  const fresh = cached && it && it.stage === "done" && cached.check && cached.check.checked_at === it.checked_at;
  if (!force && (fresh || detailError[id] === 404)) return;
  let res;
  try { res = await fetch(`/api/set/${encodeURIComponent(id)}`, {cache: "no-store"}); } catch (e) { return; }  // 연결 상태는 tick()이 정한다
  if (!res.ok) { detailError[id] = res.status; return; }
  delete detailError[id];
  detailCache[id] = await res.json();
}

async function tick() {
  let res = null;
  try { res = await fetch("/api/state", {cache: "no-store"}); } catch (e) { conn = "offline"; }  // 네트워크 오류: 서버가 꺼졌거나 닿지 않음
  if (res && !res.ok) conn = "error";
  if (res && res.ok) {
    try { S = await res.json(); conn = "online"; } catch (e) { conn = "error"; }  // 마지막으로 받은 상태는 그대로 둔다
    const [page, id] = route();
    if (conn === "online" && page === "set" && id) await loadDetail(id);
  }
  const did = route()[1], dc = detailCache[did];
  const sig = conn + location.hash + JSON.stringify(S ? {...S, now: 0} : null) + JSON.stringify([dc ? dc.check && dc.check.checked_at : null, detailError[did] || null]);
  if (sig !== lastSig) { lastSig = sig; render(); }
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-filter],[data-rfilter],[data-tab],[data-sel],[data-clear]");
  if (!t) return;
  if (t.dataset.filter) filter = t.dataset.filter;
  if (t.dataset.rfilter) resultFilter = t.dataset.rfilter;
  if (t.dataset.tab) detailTab = t.dataset.tab;
  if (t.dataset.sel) {
    selected = selected === t.dataset.sel ? null : t.dataset.sel;
    const d = detailCache[route()[1]], r = d && d.check && d.check.results.find(x => x.key === selected);
    if (r && !r.evidence.length && r.source_box) detailTab = "doc";  // 포스터 근거가 없으면 문서 쪽을 보여 준다
  }
  if (t.dataset.clear) selected = null;
  render();
});
window.addEventListener("hashchange", async () => {
  selected = null; resultFilter = "all"; detailTab = "poster"; window.scrollTo(0, 0);
  const [p, id] = route();
  if (p === "set" && id) await loadDetail(id, true);
  render();
});
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
