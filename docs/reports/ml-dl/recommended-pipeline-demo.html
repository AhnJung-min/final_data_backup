<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0069dc">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>바로검수 권장 구성</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: the 바로검수 workspace shell. Sidebar = the pipeline itself (9 stages, each tagged
   with the engine that owns it); main = sample poster with live overlays beside a detail panel;
   a floating dock steps through the stages. */
:root{
  --bg:#f6f8fb;--card:#fff;--ink:#18283f;--strong:#152844;--muted:#64758a;--line:#dce5ee;--soft:#f4f7fa;--pale:#eaf4ff;--pale-line:#d4e8ff;
  --blue:#0069dc;--brand:#0069dc;--brand-hover:#0051b2;--on-brand:#fff;--brand-soft:#cce4ff;
  --green:#14765d;--green-bg:#e9f5ef;--red:#bc3f39;--red-bg:#fff0ed;--amber:#9b6505;--amber-bg:#fff6df;
  --violet:#5a42c2;--violet-bg:#efecfd;--slate:#4c6178;--slate-bg:#edf1f6;
  --canvas:#edf2f7;--glass:rgba(255,255,255,.84);--tip:#152844;--on-tip:#fff;
  --radius:16px;--shadow:0 14px 40px rgba(27,65,105,.08);--dock-shadow:0 12px 36px rgba(27,65,105,.18);
  --sans:"Pretendard Variable","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b111b;--card:#121a27;--ink:#e8eef6;--strong:#f4f7fb;--muted:#93a2b6;--line:#232f42;--soft:#172131;--pale:#0f2748;--pale-line:#1b3c69;
  --blue:#5aa5ff;--brand:#0069dc;--brand-hover:#1a7bea;--on-brand:#fff;--brand-soft:#cce4ff;
  --green:#52cba6;--green-bg:#0f2c25;--red:#ff8f85;--red-bg:#381a18;--amber:#efb759;--amber-bg:#30260f;
  --violet:#b5a6ff;--violet-bg:#221c45;--slate:#a9b7c9;--slate-bg:#1b2636;
  --canvas:#0e1622;--glass:rgba(18,26,39,.82);--tip:#e8eef6;--on-tip:#0b111b;
  --shadow:0 14px 40px rgba(0,0,0,.35);--dock-shadow:0 12px 36px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b111b;--card:#121a27;--ink:#e8eef6;--strong:#f4f7fb;--muted:#93a2b6;--line:#232f42;--soft:#172131;--pale:#0f2748;--pale-line:#1b3c69;
  --blue:#5aa5ff;--brand:#0069dc;--brand-hover:#1a7bea;--on-brand:#fff;--brand-soft:#cce4ff;
  --green:#52cba6;--green-bg:#0f2c25;--red:#ff8f85;--red-bg:#381a18;--amber:#efb759;--amber-bg:#30260f;
  --violet:#b5a6ff;--violet-bg:#221c45;--slate:#a9b7c9;--slate-bg:#1b2636;
  --canvas:#0e1622;--glass:rgba(18,26,39,.82);--tip:#e8eef6;--on-tip:#0b111b;
  --shadow:0 14px 40px rgba(0,0,0,.35);--dock-shadow:0 12px 36px rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
h1,h2,h3,p,ol{margin:0}ol{padding:0;list-style:none}
h1,h2,h3{line-height:1.35;letter-spacing:-.04em;text-wrap:balance}
:focus-visible{outline:3px solid #82b9ff;outline-offset:3px;border-radius:6px}
.icon{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.num{font:500 13px/1 var(--mono);font-variant-numeric:tabular-nums}
code{font:500 12px/1.4 var(--mono);color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:256px minmax(0,1fr)}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:28px 18px 22px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;font-size:21px;font-weight:800;letter-spacing:-.07em;color:var(--strong)}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.brand-mark .icon{width:22px;height:22px;stroke-width:2.5}
.ws{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.ws .icon{color:var(--blue);width:18px;height:18px}
.nav{display:flex;flex-direction:column;gap:16px}
.grp-title{font-size:12px;color:var(--muted);padding:0 10px 6px;letter-spacing:.02em}
.grp ol{display:flex;flex-direction:column;gap:3px}
.st{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;text-align:left;font-size:14px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.st:hover{background:var(--soft);color:var(--ink)}
.st.current{background:var(--pale);color:var(--blue)}
.st-num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:12px;flex-shrink:0}
.st-num .icon{width:14px;height:14px;stroke-width:2.4}
.st.current .st-num{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.st.done .st-num{background:var(--green-bg);border-color:var(--green-bg);color:var(--green)}
.st-name{flex:1;min-width:0}
.eng{font:700 10.5px/1 var(--sans);padding:4px 6px;border-radius:5px;letter-spacing:.02em;white-space:nowrap}
.eng.dl,.chip.dl{background:var(--pale);color:var(--blue)}
.eng.ml,.chip.ml{background:var(--violet-bg);color:var(--violet)}
.eng.code,.chip.code{background:var(--slate-bg);color:var(--slate)}
.eng.human,.chip.human{background:var(--green-bg);color:var(--green)}
.st.current .eng.dl{background:var(--card)}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--muted);line-height:1.7}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}

.area{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 36px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.crumb{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);min-width:0}
.crumb b{color:var(--ink);font-weight:600;white-space:nowrap}
.pill{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:700;background:var(--pale);color:var(--blue);white-space:nowrap}
.pill.quiet{background:var(--soft);color:var(--muted)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.bar{height:3px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--brand);border-radius:0 3px 3px 0;transition:width .35s cubic-bezier(.2,.8,.2,1)}

.main{width:100%;max-width:1280px;margin:0 auto;padding-inline:36px;padding-block:34px 28px;display:flex;flex-direction:column;gap:26px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--blue);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.head h1{font-size:clamp(24px,2.6vw,32px);font-weight:800;color:var(--strong);margin:8px 0 8px}
.head p{font-size:15px;color:var(--muted);max-width:44rem}

.grid{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.2fr);gap:24px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
.card-head h2{font-size:16px;letter-spacing:-.03em;color:var(--strong)}
.poster-card{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.stage-wrap{padding:22px;background:var(--canvas)}
.canvas{position:relative;max-width:380px;margin:0 auto;border-radius:8px;overflow:hidden;line-height:0;box-shadow:0 7px 22px rgba(20,45,75,.22)}
.canvas svg{display:block;width:100%;height:auto}
.ov{position:absolute;inset:0;line-height:1.3}
.caption{padding:14px 22px;font-size:12.5px;color:var(--muted);min-height:3.4em}

/* poster overlays: fixed colors, they sit on the poster art */
.bx{position:absolute;border:2px solid #ffb547;border-radius:5px;transition:opacity .15s,background .15s;animation:pop .34s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*40ms)}
.bx-tag{position:absolute;left:-2px;bottom:100%;margin-bottom:2px;padding:1px 6px;border-radius:4px;background:#152844;color:#fff;font:700 10.5px/1.55 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.bx.ok{border-color:#7fe3c0}
.bx.hold{border-color:#ffc24b;border-style:dashed;background:rgba(255,194,75,.2)}
.bx.hold .bx-tag{background:#8a5a05}
.bx.link{border-color:#fff;box-shadow:0 0 0 1px rgba(21,40,68,.55)}
.bx.link .bx-tag{background:#fff;color:#152844;box-shadow:0 0 0 1px rgba(21,40,68,.3)}
.bx.ghost{border:1.5px dashed rgba(255,255,255,.5);box-shadow:0 0 0 1px rgba(21,40,68,.25)}
.bx.det{border-color:#ffe27a}
.bx.det .bx-tag{background:#ffe27a;color:#3d3000}
.bx.frame{border-color:rgba(255,255,255,.9);border-style:dashed}
.bx.pass{border-color:#58e0a8}.bx.pass .bx-tag{background:#0f6b52}
.bx.fail{border-color:#ff7b6e}.bx.fail .bx-tag{background:#b53a34}
.bx.review{border-color:#ffc24b}.bx.review .bx-tag{background:#8a5a05}
.bx.tagside .bx-tag{left:100%;bottom:auto;top:50%;transform:translateY(-50%);margin:0 0 0 5px}
.bx.tagside.flip .bx-tag{left:auto;right:100%;margin:0 5px 0 0}
.bx.in .bx-tag{bottom:auto;top:6px;left:6px;right:auto;transform:none;margin:0}
.ov.still .bx{animation:none}
.bx.hot{border-width:3px;background:rgba(255,255,255,.14);z-index:2}
.bx.dim{opacity:.2}
.bx.spot{box-shadow:0 0 0 9999px rgba(8,22,40,.5);z-index:3}
@keyframes pop{from{opacity:0;transform:scale(.96)}}

/* panel */
.panel-head{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head .eng{font-size:11px;padding:5px 7px}
.panel-head strong{font-size:15px;color:var(--strong);letter-spacing:-.02em}
.panel-head span.model{font-size:12.5px;color:var(--muted);margin-left:auto}
.panel-body{padding:22px;display:flex;flex-direction:column;gap:20px;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.role{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.role>div{padding:13px 16px}
.role>div+div{border-left:1px solid var(--line);background:var(--soft)}
.role-k{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700}
.role-k .icon{width:14px;height:14px;stroke-width:2.4}
.role-k.ok{color:var(--green)}.role-k.no{color:var(--muted)}
.role p{font-size:14px;margin-top:3px}
.sec{display:flex;align-items:baseline;gap:10px;font-size:13px;font-weight:700;color:var(--strong);margin-bottom:-8px}
.hint{font-size:12px;font-weight:500;color:var(--muted)}
.note{display:flex;gap:9px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--pale);color:var(--ink);font-size:13.5px;line-height:1.7}
.note .icon{width:17px;height:17px;color:var(--blue);margin-top:3px}
.note mark,.jrow mark{background:var(--amber-bg);color:var(--amber);padding:0 2px;border-radius:3px;font-weight:700}

.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;transition:border-color .15s,background .15s}
.row.wide{grid-template-columns:46px minmax(0,1fr) 92px 38px 68px}
.row.fld{grid-template-columns:84px minmax(0,1fr)}
.row.mug{grid-template-columns:64px minmax(0,1fr) 38px}
.row.hot,.row:hover,.row:focus-visible,.jrow.hot,.jrow:hover,.res.hot{border-color:var(--blue);background:var(--pale)}
.row-text{min-width:0;overflow-wrap:anywhere}
.row-text em{font-style:normal;color:var(--ink)}
.row .fname{font-weight:700;font-size:13px;color:var(--strong)}
.track{position:relative;height:8px;border-radius:8px;background:var(--slate-bg)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--brand)}
.track i.low{background:#e0a23a}
.track b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--strong);border-radius:2px}
.state{font-size:11.5px;font-weight:700;text-align:right;white-space:nowrap}
.state.auto{color:var(--green)}.state.hold{color:var(--amber)}
.sum{display:flex;gap:10px;flex-wrap:wrap}
.sum div{flex:1 1 140px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.sum strong{font-size:24px;line-height:1;color:var(--strong)}
.sum .g strong{color:var(--green)}.sum .a strong{color:var(--amber)}.sum .r strong{color:var(--red)}

.reqs{display:flex;flex-direction:column;gap:6px}
.req{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.6;transition:border-color .15s,background .15s}
.req:hover{background:var(--soft)}
.req.on{border-color:var(--blue);background:var(--pale);font-weight:600}
.probs{display:flex;flex-direction:column;gap:10px}
.prob{display:grid;grid-template-columns:76px minmax(0,1fr) 38px;gap:12px;align-items:center;font-size:13.5px;color:var(--muted)}
.prob.best{color:var(--strong);font-weight:700}
.prob:not(.best) .track i{background:var(--muted);opacity:.55}
.outcome{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:12px;font-size:14px}
.outcome .icon{margin-top:2px}
.outcome.go{background:var(--green-bg);color:var(--green)}
.outcome.ask{background:var(--amber-bg);color:var(--amber)}
.outcome b{display:block;color:inherit}
.outcome span{color:var(--ink);font-size:13.5px}

.crit{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.crit-head{display:flex;gap:10px;align-items:flex-start}
.crit-head strong{flex:1;font-size:14.5px;letter-spacing:-.02em;color:var(--strong)}
.crit-no{font:700 12px/1.9 var(--mono);color:var(--muted)}
.crit-src{display:flex;gap:8px;font-size:12.5px;color:var(--muted)}
.crit-src .icon{width:15px;height:15px;margin-top:2px}
.crit-src b{color:var(--ink);font-weight:600}
.route{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:5px;white-space:nowrap}
.arrow{color:var(--muted);font-size:12px}
.codeblock{margin:0;padding:14px 16px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font:500 12.5px/1.75 var(--mono);color:var(--ink);overflow-x:auto;white-space:pre}
.codeblock .k{color:var(--blue)}.codeblock .s{color:var(--green)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;gap:9px;align-items:center;padding:8px 12px 8px 8px;border:1px solid var(--line);border-radius:10px;font:500 12.5px var(--mono)}
.sw i{width:26px;height:26px;border-radius:7px;border:1px solid var(--line)}
.box2{border:1px solid var(--line);border-radius:12px;padding:15px 16px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,background .15s}
.box2.hot,.box2:hover{border-color:var(--blue);background:var(--pale)}
.box2 h3{font-size:14.5px;color:var(--strong);display:flex;gap:8px;align-items:center}
.box2 p{font-size:13.5px;color:var(--muted)}
.quote{font-size:14.5px;color:var(--ink);border-left:3px solid var(--blue);padding-left:12px}

.jrow{border:1px solid var(--line);border-radius:12px;padding:13px 16px;display:flex;flex-direction:column;gap:9px;transition:border-color .15s,background .15s}
.j-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.j-top strong{font-size:14.5px;color:var(--strong)}
.j-cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.j-cmp div{display:flex;flex-direction:column;gap:1px;min-width:0}
.j-cmp span{font-size:11.5px;color:var(--muted)}
.j-cmp b{font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.j-note{font-size:12.5px;color:var(--muted)}
.status{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:5px;white-space:nowrap}
.status.pass{background:var(--green-bg);color:var(--green)}
.status.fail{background:var(--red-bg);color:var(--red)}
.status.review{background:var(--amber-bg);color:var(--amber)}

.seg{display:flex;padding:4px;border-radius:12px;background:var(--soft);border:1px solid var(--line);gap:4px}
.seg button{flex:1;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.seg button[aria-checked="true"]{background:var(--card);color:var(--blue);box-shadow:0 1px 4px rgba(20,45,75,.12)}
.cfg-note{font-size:13.5px;color:var(--muted)}
.filter{display:flex;gap:7px;flex-wrap:wrap}
.filter button{padding:7px 13px;border-radius:7px;background:var(--soft);font-size:12.5px;color:var(--muted)}
.filter button[aria-pressed="true"]{background:var(--pale);color:var(--blue);font-weight:700}
.res-list{display:flex;flex-direction:column;gap:8px}
.res{border:1px solid var(--line);border-radius:12px;padding:15px 16px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,background .15s}
.res-head{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.flag{font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:5px;border:1px solid var(--red);color:var(--red)}
.res h3{font-size:14.5px;letter-spacing:-.02em;color:var(--strong)}
.res p{font-size:13.5px;color:var(--muted);line-height:1.75}
.res-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.text-btn{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;font-weight:700;color:var(--blue);padding:4px 0}
.text-btn:hover{text-decoration:underline}
.text-btn .icon{width:15px;height:15px}
.nobox{font-size:12px;color:var(--muted)}
.empty{padding:26px;text-align:center;font-size:14px;color:var(--muted)}
.approve{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-top:6px}
.approve p{font-size:13px;color:var(--muted)}
.approve div{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:700;transition:background .18s,transform .18s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.secondary{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.secondary:hover{background:var(--soft)}

/* dock */

        <div class="rows">${linked.map(c => `<div class="row fld" tabindex="0" data-key="c${c.id}"><span class="fname">${c.field}</span><span class="row-text">${c.lines.map(id => `<code>${id}</code>`).join(' ')} <em>${esc(c.observed)}</em></span></div>`).join('')}</div>
        <p class="cfg-note">연결하지 않은 줄: ${LINES.filter(l => !used.has(l.id)).map(l => `<code>${l.id}</code>`).join(' ')}</p>
        <div class="sec">VLM 출력 <span class="hint">줄 ID만 담깁니다</span></div>
        <pre class="codeblock">${json}</pre>
        ${note("출력에 글자가 없으므로 VLM이 오타를 고쳐 쓸 수 없습니다. 장소는 OCR 원문 <mark>코액스</mark> 그대로 다음 단계로 갑니다.")}`;
    },
    detect() {
      const count = MUGS.filter(m => m[4] >= DET_T).length;
      return `<div class="sum"><div><span>지시어</span><strong style="font:700 18px var(--mono)">mug</strong></div><div class="g"><span>찾은 개수</span><strong>${count}</strong></div></div>
        <div class="sec">검출 결과 <span class="hint">예시 값 · 세로선은 채택 기준 ${fx(DET_T)}</span></div>
        <div class="rows">${MUGS.map((m, i) => `<div class="row mug" tabindex="0" data-key="m${i}"><span class="fname">머그 ${i + 1}</span>${track(m[4], DET_T)}<span class="num">${fx(m[4])}</span></div>`).join('')}</div>
        ${note('라벨 없이 시작할 수 있습니다. 담당자가 고친 박스가 쌓이면 그 데이터로 미세조정한 검출기와 비교합니다.')}`;
    },
    look() {
      return `<div class="box2" data-key="look"><h3>${icon('eye')}외관 관찰 <span class="chip dl">VLM 외관 서술</span></h3>
          <p>대상: 필수 문구 영역 <code>t-09</code></p><p class="quote">문구 아랫부분이 잘려 글자 하단이 보이지 않습니다.</p>
          <p>충족 여부를 정하지 않고, 관찰문을 확인 필요 항목에 붙여 담당자에게 보냅니다.</p></div>
        <div class="box2" data-key="color"><h3>${icon('swatch')}대표 색 <span class="chip ml">색 군집</span></h3>
          <div class="swatches"><span class="sw"><i style="background:#0069dc"></i>#0069DC</span><span class="sw"><i style="background:#fff"></i>#FFFFFF</span></div>
          <p>넓게 쓰인 순서입니다. 가장 넓은 색이 기준색 #0069DC와 같습니다.</p></div>
        ${note('VLM에 색이나 개수를 묻지 않습니다. 색은 픽셀 계산, 개수는 검출 모델이 맡아야 수치로 비교할 수 있습니다.')}`;
    },
    judge() {
      const count = s => CRITERIA.filter(c => c.status === s).length;
      return `<div class="sum"><div class="g"><span>충족</span><strong>${count('pass')}</strong></div><div class="r"><span>위반</span><strong>${count('fail')}</strong></div><div class="a"><span>확인 필요</span><strong>${count('review')}</strong></div></div>
        ${CRITERIA.map(c => `<div class="jrow" tabindex="0" data-key="c${c.id}"><div class="j-top"><strong>${c.field}</strong>${status(c.status)}</div>
          <div class="j-cmp"><div><span>기준</span><b>${esc(c.expected)}</b></div><div><span>관찰</span><b>${c.status === 'review' ? '비교 보류' : diff(c.expected, c.observed)}</b></div></div>
          <p class="j-note">${esc(c.reason)}</p></div>`).join('')}`;
    },
    review() {
      const list = results(), counts = {pass: 0, fail: 0, review: 0};
      list.forEach(r => counts[r.status]++);
      const rows = list.filter(r => state.filter === 'all' || r.status === state.filter);
      return `<div class="sec">구성 비교</div>
        <div class="seg" role="radiogroup" aria-label="구성 비교">${Object.entries(CONFIGS).map(([key, cfg]) => `<button role="radio" aria-checked="${key === state.cfg}" data-cfg="${key}">${cfg.label}</button>`).join('')}</div>
        <p class="cfg-note">${esc(CONFIGS[state.cfg].note)}</p>
        <div class="sum"><div class="g"><span>충족</span><strong>${counts.pass}</strong></div><div class="r"><span>위반</span><strong>${counts.fail}</strong></div><div class="a"><span>확인 필요</span><strong>${counts.review}</strong></div></div>
        <div class="filter" role="group" aria-label="결과 필터">${[['all', '전체'], ['fail', '위반'], ['review', '확인 필요'], ['pass', '충족']].map(([key, label]) => `<button data-filter="${key}" aria-pressed="${state.filter === key}">${label}</button>`).join('')}</div>
        <div class="res-list">${rows.length ? rows.map(r => `<article class="res" data-key="c${r.id}"><div class="res-head">${status(r.status)}${r.flag ? `<span class="flag">${esc(r.flag)}</span>` : ''}<span>${r.cat === 'visual' ? '시각 검수' : '정보 검수'}</span></div>
          <h3>${esc(r.text)}</h3><p>${esc(r.reason)}</p>
          <div class="res-foot"><div class="route">${r.route.length ? chips(r.route) : '<span class="nobox">실행한 단계 없음</span>'}</div>${r.hasBox ? `<button class="text-btn" data-evidence="${r.id}">${icon('search')}위치 보기</button>` : '<span class="nobox">근거 위치 없음</span>'}</div></article>`).join('') : '<div class="empty">해당 상태의 항목이 없습니다.</div>'}</div>
        <div class="approve"><p>검수 실행이 끝났다고 최종 승인된 것은 아닙니다.</p><div><button class="btn secondary" data-demo>확인 필요 확정</button><button class="btn primary" data-demo>수정 요청 보내기</button></div></div>`;
    }
  };

  function renderPanel() {
    const s = STAGES[state.stage];
    $('panel-head').innerHTML = `<span class="eng ${s.kind}">${{dl: 'DL', ml: 'ML', code: '코드', human: '사람'}[s.kind]}</span><strong>${esc(s.engine)}</strong><span class="model">${esc(s.model)}</span>`;
    panel.innerHTML = role(s) + VIEWS[s.id]();
    renderOverlay();
    const evidence = state.evidence && results().find(r => r.id === state.evidence);
    $('caption').textContent = evidence ? evidence.reason
      : s.id === 'review' && CONFIGS[state.cfg].noBox ? 'VLM 단독 구성에서는 표시할 근거 위치가 없습니다.' : s.caption;
  }
  function render(announce) {
    const s = STAGES[state.stage], n = state.stage + 1;
    document.querySelectorAll('.st').forEach(btn => {
      const i = Number(btn.dataset.stage);
      btn.classList.toggle('current', i === state.stage); btn.classList.toggle('done', i < state.stage);
      if (i === state.stage) btn.setAttribute('aria-current', 'step'); else btn.removeAttribute('aria-current');
      btn.querySelector('.st-num').innerHTML = i < state.stage ? icon('check') : String(i + 1);
    });
    $('eyebrow').textContent = `STAGE ${String(n).padStart(2, '0')} · ${s.group}`;
    $('title').textContent = s.title; $('desc').textContent = s.desc; $('crumb').textContent = s.name;
    $('layer').textContent = s.layer; $('pos').textContent = n;
    $('bar').style.width = (n / STAGES.length * 100).toFixed(1) + '%';
    $('prev').disabled = state.stage === 0; $('next').disabled = state.stage === STAGES.length - 1;
    renderPanel();
    if (announce) $('live').textContent = `${n}단계 ${s.name}. ${s.title}`;
  }
  function go(index, user) {
    const next = Math.max(0, Math.min(STAGES.length - 1, index));
    if (user) stop();
    if (next === state.stage) return;
    state.stage = next; state.evidence = null;
    render(true);
    const current = document.querySelector('.st.current');
    if (current && current.scrollIntoView && matchMedia('(max-width:860px)').matches) current.scrollIntoView({block: 'nearest', inline: 'center'});
    if (window.scrollY > 140) window.scrollTo({top: 0, behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth'});
    try { history.replaceState(null, '', '#s' + (next + 1)); } catch (error) { /* sandboxed frames may refuse */ }
  }
  function stop() {
    clearInterval(state.timer); state.timer = null;
    $('play').setAttribute('aria-pressed', 'false'); $('play-icon').setAttribute('href', '#i-play'); $('play-label').textContent = '자동 재생';
  }
  function play() {
    if (state.timer) { stop(); return; }
    if (state.stage === STAGES.length - 1) { state.stage = -1; }
    $('play').setAttribute('aria-pressed', 'true'); $('play-icon').setAttribute('href', '#i-pause'); $('play-label').textContent = '멈춤';
    const tick = () => { if (state.stage >= STAGES.length - 1) { stop(); return; } go(state.stage + 1); if (state.stage === STAGES.length - 1) stop(); };
    state.timer = setInterval(tick, 3200); tick();
  }
  function notify(message) {
    clearTimeout(toastTimer); $('toast').textContent = message; $('toast').hidden = false;
    toastTimer = setTimeout(() => { $('toast').hidden = true; }, 2600);
  }

  document.querySelectorAll('.st').forEach(btn => btn.addEventListener('click', () => go(Number(btn.dataset.stage), true)));
  $('prev').addEventListener('click', () => go(state.stage - 1, true));
  $('next').addEventListener('click', () => go(state.stage + 1, true));
  $('play').addEventListener('click', play);
  document.addEventListener('keydown', event => {
    const target = event.target instanceof Element ? event.target : null;
    if (event.altKey || event.ctrlKey || event.metaKey || (target && target.closest('[role="radio"],input,textarea,select'))) return;
    if (event.key === 'ArrowRight') go(state.stage + 1, true);
    if (event.key === 'ArrowLeft') go(state.stage - 1, true);
  });
  panel.addEventListener('click', event => {
    const target = event.target.closest('[data-req],[data-cfg],[data-filter],[data-evidence],[data-demo]');
    if (!target) return;
    const d = target.dataset;
    if (d.req) state.req = Number(d.req);
    if (d.cfg) { state.cfg = d.cfg; state.evidence = null; state.filter = 'all'; }
    if (d.filter) { state.filter = d.filter; state.evidence = null; }
    if (d.evidence) state.evidence = state.evidence === Number(d.evidence) ? null : Number(d.evidence);
    if ('demo' in d) { notify('데모 화면이라 저장되지 않습니다.'); return; }
    const selector = d.req ? `[data-req="${d.req}"]` : d.cfg ? `[data-cfg="${d.cfg}"]` : d.filter ? `[data-filter="${d.filter}"]` : `[data-evidence="${d.evidence}"]`;
    renderPanel();
    const again = panel.querySelector(selector); if (again) again.focus({preventScroll: true});
    if (d.evidence && state.evidence && matchMedia('(max-width:860px)').matches) $('poster').scrollIntoView({behavior: 'smooth', block: 'center'});
  });
  const hover = event => { const row = event.target.closest('[data-key]'); if (!state.evidence) setHot(row ? [row.dataset.key] : null); };
  panel.addEventListener('pointerover', hover); panel.addEventListener('focusin', hover);
  panel.addEventListener('pointerleave', () => { if (!state.evidence) setHot(null); });
  panel.addEventListener('focusout', () => { if (!state.evidence) setHot(null); });
  ov.addEventListener('pointerover', event => { const box = event.target.closest('.bx'); if (!state.evidence) setHot(box ? box.dataset.keys.split(' ') : null); });
  ov.addEventListener('pointerleave', () => { if (!state.evidence) setHot(null); });

  const fromHash = () => { const match = /^#s([1-9])$/.exec(location.hash); return match ? Number(match[1]) - 1 : null; };
  window.addEventListener('hashchange', () => { const index = fromHash(); if (index !== null) go(index, true); });
  if (fromHash() !== null) state.stage = fromHash();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderOverlay(true));
})();
</script>
</body>
</html>
